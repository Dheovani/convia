# Local development dependencies for Convia.
#
# These credentials are development-only and must never be reused anywhere
# else. Production configuration comes from the deployment environment.

services:
  postgres:
    image: postgres:17-alpine
    container_name: convia-postgres
    environment:
      POSTGRES_USER: convia
      POSTGRES_PASSWORD: convia
      POSTGRES_DB: convia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # The check connects over TCP rather than the local socket: the postgres
    # image runs initdb against a temporary socket-only server, so a socket
    # probe reports ready while TCP connections are still refused.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username=convia --dbname=convia"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Convia runs perfectly well without a media plane, so this one is opt-in:
  #
  #   docker compose --profile media up -d
  #
  # Start it to work on the media adapter or to run its integration tests.
  livekit:
    image: livekit/livekit-server:v1.13.6
    container_name: convia-livekit
    profiles: ["media"]
    command: --dev --bind 0.0.0.0
    environment:
      # Development-only, and matched in .env.example. A real deployment gets
      # its keys from the deployment environment or a secret manager.
      LIVEKIT_KEYS: "devkey: a-development-secret-long-enough-to-be-accepted"
    ports:
      # Only the control API is published. Convia does not carry media yet, so
      # the ports a participant would connect on arrive with M13.
      - "127.0.0.1:7880:7880"
    restart: unless-stopped

  # A single Convia instance needs none of this: its event broker is in
  # process, and everything it publishes reaches everything it serves. Redis is
  # what carries events *between* instances, so it is opt-in too:
  #
  #   docker compose --profile shared up -d
  #
  # Start it to run the relay's integration tests, or to run two local
  # instances and watch a subscriber on one see an event produced on the other.
  redis:
    image: redis:8.2-alpine
    container_name: convia-redis
    profiles: ["shared"]
    # Nothing durable lives here. Events are carried over publish/subscribe,
    # which stores nothing at all, and presence is a set of keys that all
    # expire — so persistence is off, and a restart loses nothing Convia
    # cannot do without.
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
