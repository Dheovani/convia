# Local development dependencies for Convia.
#
# These credentials are development-only and must never be reused anywhere
# else. Production configuration comes from the deployment environment.

services:
  postgres:
    image: postgres:17-alpine
    container_name: convia-postgres
    environment:
      POSTGRES_USER: convia
      POSTGRES_PASSWORD: convia
      POSTGRES_DB: convia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=convia --dbname=convia"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
