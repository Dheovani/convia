# coturn for Convia: STUN, and TURN with the short-lived credentials of ADR 0023.
# The secret is never written here: give it as --static-auth-secret, or in a file outside the repository.

listening-port=3478
fingerprint
use-auth-secret
realm=convia
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1

# For turns: on 5349, give the deployment's certificate.
# tls-listening-port=5349
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/key.pem

# coturn logs the addresses of the peers it relays, so it logs nothing (as ADR 0022 asks of the rendezvous service).
log-file=/dev/null
simple-log
no-stdout-log

# A credential must never reach the network the relay runs in (ADR 0023).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
