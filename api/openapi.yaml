openapi: 3.0.3

info:
  title: Convia API
  version: 0.1.0
  description: |
    Convia is a real-time communication platform. This document is the contract
    for its public HTTP API and for the operational endpoints that surround it.

    Media transport is an internal implementation detail. No field, schema, or
    error in this contract may expose a media provider concept.

    The transport rules that every endpoint follows are described in
    `docs/api-conventions.md`. The compatibility rules that govern changes to
    this document are described in `docs/api-compatibility.md`.
  license:
    name: PolyForm Noncommercial License 1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0

servers:
  - url: http://localhost:8080
    description: Local development instance.

tags:
  - name: Operations
    description: |
      Operational endpoints for operators and deployment infrastructure. They
      are served outside the versioned public API prefix and are not part of the
      public product interface.
  - name: Applications
    description: |
      Operator endpoints for Convia's tenants.

      An application's own key must never be able to create tenants, so these
      endpoints require an operator credential instead. They name the tenant in
      the path, because acting on someone else is what an operator does.

      They exist to bootstrap: create the first application, issue its first
      key. After that an application manages its own users and credentials
      through the authenticated tenant endpoints.
  - name: Credentials
    description: |
      The API keys an application authenticates with.

      A credential is an opaque bearer key carrying explicit scopes. Convia
      stores only a digest of the secret, so the secret is returned exactly once
      and can never be shown again.

      An application manages its own keys under `/v1/credentials`, using a key
      it already holds. The operator routes under `/v1/applications/{id}` exist
      to issue the first one, which is a bootstrap an application cannot
      perform for itself, and they require an operator credential.
  - name: Operator
    description: |
      The credentials that administer Convia itself.

      An operator credential is a different thing from an application's key: it
      belongs to no tenant, carries its own scopes, and uses the `cvo_` prefix
      rather than `cvk_`. It is what the endpoints under `/v1/applications`
      require, because an application's key must never be able to create
      tenants.

      The first one cannot be issued over the API, because issuing one requires
      presenting one. It is created with `convia operator issue`, which needs
      database access — the authority the first key is minted from.

  - name: Rooms
    description: |
      The places an application's people meet.

      A room is durable: it outlives any single conversation held in it. An
      alias is what makes one addressable by a name the application chose, so
      a durable room can be reached without remembering a Convia identifier.
      A room created without an alias is ephemeral, referred to only by its
      identifier.

      An application manages its own rooms under `/v1/rooms`, with the tenant
      taken from its credential. The routes nested under
      `/v1/applications/{id}/rooms` are the operator-facing equivalents.

      Nothing here names a media provider. A room is a Convia concept that the
      media plane is later asked to realize.

  - name: Calls
    description: |
      The conversations held in an application's rooms.

      A call is the occasion; the room is the place. A room outlives every
      conversation held in it, which is why the two are separate resources: a
      room is created once, and calls happen in it repeatedly.

      A room holds one call at a time. Starting a call in a room that already
      has one is refused rather than answered with the running call, because
      starting and finding are different questions.

      An application starts and ends its own calls with the tenant taken from
      its credential. An operator can read a tenant's calls and end one, but
      cannot start one: starting a conversation between an application's people
      is not administration.

      Nothing here names a media provider. A call is a Convia concept that the
      media plane is later asked to realize.

  - name: Participants
    description: |
      Who is in a call, and what happened to them.

      M10 keeps three ideas apart. **Room membership** — who belongs to a place
      over time — is not modelled: Convia holds no credentials for an
      application's people, so it could not enforce a policy about who belongs.
      An **invitation** — permission to join that has not been used yet —
      arrives with the join sessions of M13, where the party presenting it is
      no longer the party that granted it. **Participation** is who actually
      joined, and it is what these routes describe.

      Joining is idempotent by the person: someone already in the call is
      returned as they are rather than added twice, which is what makes a
      reconnection safe.

      An application admits, removes, and promotes people in its own calls. An
      operator may read a roster and remove someone from it, and nothing else.

      Nothing here names a media provider. Whether someone may join is a Convia
      decision; handing them a media token is a later and separate one.

  - name: Users
    description: |
      The people an application knows about.

      An application addresses its own users under `/v1/users`, with the tenant
      taken from its credential rather than named in the path. The routes nested
      under `/v1/applications/{id}/users` are the operator-facing equivalents
      and require an operator credential carrying a tenants scope.

      Convia never links users across applications: the same human known to two
      applications is two unrelated Convia users.

  - name: Events
    description: |
      Convia's live control events.

      One endpoint, and it is the only one in this document that stops being a
      request and a response. The handshake is ordinary HTTP and is described
      here in full; what travels afterwards is a stream of `Event` objects,
      whose shape is also described here, in the order Convia produced them.

      **What streams is deliberately narrower than what Convia records.** These
      are the events whose value decays in seconds — a conversation starting or
      ending, and the roster of who is in it — because a client's picture of
      something happening right now goes stale without them. A change the
      application itself made through a request that already returned the new
      state is not among them.

      The stream carries nothing upstream. Convia never interprets a message
      from a client, so a client that sends one has its connection closed
      rather than ignored. It carries no audio or video either, and could not:
      a participant's client reaches the media plane directly, with the
      short-lived credential
      `POST /v1/participants/{participant_id}/session` issues.

      See `docs/events.md` for the delivery guarantees, the close codes, and
      what running more than one instance requires.

  - name: Sessions
    description: |
      How a person signs in to Convia's own interface.

      This is the only surface in Convia that authenticates a **person** rather
      than a program, and the only one whose credential is a cookie rather than
      an `Authorization` header. The two facts are connected: a browser holds a
      cookie safely and holds a bearer token badly.

      A session carries **no scopes**. That is deliberate and it is the most
      important thing on this page. Everywhere else in Convia, authority is an
      application's: a key holds scopes over a whole tenant, and every one of
      its people is data that key can read. A person is not an integration, so
      a session is not a key with a different prefix — it proves who somebody
      is, and what they may do is decided per operation, against them.

      A person creates their own account on the installation, with a username
      and a password, and nothing else — no email and no operator. The password
      also seals the account's private key, whose fingerprint is the account
      identifier, so **there is no password reset**: nothing can reopen the key
      without it. See `docs/sessions.md`.

      See `docs/sessions.md` for the cookie's attributes, the two expiry
      windows, and what signing out actually revokes.

  - name: Me
    description: |
      What a signed-in person does with their own conversations.

      Every route here names nobody. The person comes from the session cookie, so there is no request field that could address somebody else's rooms or write in somebody else's name — **not because a handler checks, but because there is nowhere to put it**. That is the same move the tenant surface makes with the application: a bug of this shape is unrepresentable rather than merely unlikely.

      These are the first routes in Convia where a session principal decides anything. It still grants no authority over a tenant: nothing here converts a session into an application key, and `docs/adr/0007` says why that shortcut stays closed.

      **A room this person is not in answers `404 not found`, never `403 forbidden`.** A refusal that separates "not yours" from "does not exist" confirms to somebody outside a conversation that the conversation is happening, which is most of what they were asking. The application surface is entitled to that distinction; a person is not.

      Responses carry `Cache-Control: no-store` and `Vary: Cookie`. These bodies are one person's conversations, and a cache that served one to somebody else would be the worst failure this surface could have.

  - name: Peers
    description: |
      Rooms shared between installations.

      A room lives on the installation where it was created — its **home**. Somebody from another installation takes part through their own: their browser talks only to the Convia they signed in to, and that Convia talks to the home on their behalf. The routes under `/v1/me` are that browser's half; the routes under `/v1/peer` are what one installation calls on another.

      **Who is asking is proved by a signature, not asserted.** Every request between installations is signed with the Ed25519 key whose fingerprint is the person's account identifier, and the home checks the signature against that key. An installation that does not hold somebody's key cannot act as them. The key is sealed by the person's password, so their installation can only sign while they are signed in.

      Joining is by invitation. Somebody in a room invites a handle, `username#IDENTIFIER`, and receives a link naming the home and the invitation. The link is not a secret: accepting it needs the invitee's signature, and the username must be the one the invitation named. An invitation lasts a day and is used once.

      See `docs/peers.md`.

  - name: Members
    description: |
      Who belongs to a room.

      Migration `00009` recorded that Convia does not model this, and gave a
      reason M18 invalidated: that Convia held no credentials for an
      application's people, so it could not enforce a policy about who belongs.
      Since M18 a person signs in to Convia's own product and presents a
      session, and at that moment Convia is the only party that can answer
      whether they may open a room.

      **It gates people, not applications.** An application's key already
      carries full authority over its own rooms. Membership is what the session
      surface checks, where somebody acts as themselves.

      A member carries **no role and no lifecycle**. A call has a moderator
      because it has something to moderate; a room member has no such power to
      hold. And membership is current state rather than the record of an
      occasion — leaving and coming back leaves no trail here, though the audit
      log records both acts.

      A guest has no membership. They have no Convia user and reach a call with
      an invitation rather than by belonging anywhere.

  - name: Messages
    description: |
      What people said, and the order they said it in.

      **A conversation is a room.** There is no separate conversation resource
      and no identifier for one: a room is already the place, a call is the
      occasion held in it, and a room's messages are its history. Messages
      therefore outlive the calls held in the room, which is what lets a
      history be something to open rather than something that ends with the
      meeting.

      A message's order comes from its `sequence`, allocated by Convia, and
      never from its timestamp. A deployment is several instances, each
      stamping `created_at` from its own clock, and two clocks that are merely
      synchronised are not the same clock.

      Convia is authoritative for the identifier, the room, the position, the
      timestamps, and who the author was. The body belongs to whoever wrote it
      and is stored **without interpretation**: no markdown is parsed, no
      mention is extracted, no link is fetched.

      **Who may read or write is not yet modelled.** These endpoints check that
      attribution is truthful — that a named author exists, belongs to the
      calling application, and is somebody Convia still serves — and check
      nothing else. An application decides who belongs in which of its rooms.
  - name: Presence
    description: |
      Who is available right now.

      Presence is the one thing in this document that is **advisory**.
      Everything else Convia exposes is a record — a call happened, somebody
      joined, an invitation was redeemed. Presence is a claim with an expiry on
      it, and the honest description of what it is worth is "this was true a
      moment ago". Nothing should be authorized on it and nothing should be
      reconciled from it.

      **Convia does not observe presence; an application asserts it.** No user
      connects to Convia, so there is no connection for Convia to notice going
      away: the only socket Convia serves is the control-event stream, and it
      belongs to an application's backend. So presence is a heartbeat, and it
      lapses when the heartbeats stop.

      **Whether somebody is in a call is a different question** with a
      different, durable answer, and it is deliberately not a field here. Ask
      `GET /v1/calls/{call_id}/participants`, which is a record with a
      lifecycle rather than a claim with a timer.

      See `docs/presence.md` for the heartbeat interval, the aggregation rule
      across a person's devices, and what happens when the store behind it is
      unreachable.

  - name: Webhooks
    description: |
      Where Convia reaches out to tell an application something.

      This is the durable counterpart of the event stream, and the two are for
      different problems. A stream delivers to whoever is connected right now
      and holds nothing, which is right for a picture that must stay current
      and that a client can rebuild by re-reading. A webhook is for something a
      consumer must not miss: every delivery is a record that exists before the
      first attempt and outlives the last, so it can be retried, counted, and
      explained afterwards.

      **Deliveries are signed and at-least-once.** Every request carries an
      HMAC over its own timestamp and body, and the same delivery may arrive
      more than once — a destination that received a body and failed to answer
      is indistinguishable from one that never received it. `Convia-Delivery`
      is what a consumer records to recognize a repeat.

      **Convia refuses to reach addresses that are not the public internet.**
      A destination is chosen by a tenant and fetched by Convia's own process,
      so the check runs on the address being connected to, at every attempt,
      rather than on the hostname at registration.

      See `docs/webhooks.md` for the signature, the retry schedule, the close
      of a failing endpoint, and what a consumer should do about duplicates.

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Report service health
      description: |
        Reports that the process is running and able to serve HTTP requests.

        This endpoint does not check downstream dependencies. A readiness
        endpoint that distinguishes process health from dependency availability
        will be introduced with the first durable dependency.
      x-lifecycle: stable
      responses:
        "200":
          description: The service is running.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

  /ready:
    get:
      operationId: getReadiness
      tags: [Operations]
      summary: Report whether the service can handle traffic
      description: |
        Reports whether Convia's dependencies are usable right now.

        Unlike `/health`, this endpoint checks dependencies, so an orchestrator
        should route traffic on readiness and restart on liveness. A failing
        check names the dependency but never explains the failure, because the
        reason would expose infrastructure detail. It is written to the logs
        instead, correlated by request ID.
      x-lifecycle: stable
      responses:
        "200":
          description: Every dependency is usable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ready
                checks:
                  database: ok
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: At least one dependency is unusable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: unavailable
                checks:
                  database: unavailable

  /v1/applications:
    post:
      operationId: createApplication
      tags: [Applications]
      summary: Create an application
      description: |
        Registers a new tenant.

        Convia assigns the identifier, the status, and the timestamps: a client
        can neither choose an identifier nor backdate a tenant. Creation is not
        idempotent yet, so a repeated request creates a second application.
      x-lifecycle: experimental
      security:
        - OperatorKey: ["applications:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
            example:
              name: Workspace Town
      responses:
        "201":
          description: The application was created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listApplications
      tags: [Applications]
      summary: List applications
      description: |
        Returns one page of applications, newest first. Deleted applications are
        not returned.
      x-lifecycle: experimental
      security:
        - OperatorKey: ["applications:read"]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of applications.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/applications/{application_id}:
    get:
      operationId: getApplication
      tags: [Applications]
      summary: Retrieve an application
      description: |
        Returns one application.

        An identifier that does not exist, is malformed, or belongs to a deleted
        application is reported the same way, so that probing reveals nothing
        about which applications exist.
      x-lifecycle: experimental
      security:
        - OperatorKey: ["applications:read"]
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "200":
          description: The requested application.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      operationId: renameApplication
      tags: [Applications]
      summary: Rename an application
      description: |
        Changes the display name of an application.

        The name is display metadata and carries no security meaning, so
        renaming an application never changes what it may do.

        Send the `ETag` from a previous read as `If-Match` to make the change
        conditional: the rename then applies only while nothing else has
        changed, and is rejected with `412` otherwise. The header is optional,
        and without it the last write wins.
      x-lifecycle: experimental
      security:
        - OperatorKey: ["applications:write"]
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameApplicationRequest"
            example:
              name: Workspace Town
      responses:
        "200":
          description: The renamed application.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteApplication
      tags: [Applications]
      summary: Delete an application
      description: |
        Removes an application from the API surface.

        The record is retained for the erasure window rather than destroyed, so
        the deletion stays recoverable. Deleting an application that is already
        deleted succeeds, because a repeated delete must not fail.
      x-lifecycle: experimental
      security:
        - OperatorKey: ["applications:write"]
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "204":
          description: The application was deleted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/applications/{application_id}/suspend:
    post:
      operationId: suspendApplication
      tags: [Applications]
      summary: Suspend an application
      description: |
        Withdraws access without losing data. A suspended application is not
        served, and its data is retained until it is activated again.

        Suspending an already-suspended application changes nothing and reports
        success, so a repeated request is safe.
      x-lifecycle: experimental
      security:
        - OperatorKey: ["applications:write"]
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "200":
          $ref: "#/components/responses/ApplicationState"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/applications/{application_id}/activate:
    post:
      operationId: activateApplication
      tags: [Applications]
      summary: Activate an application
      description: |
        Restores a suspended application to normal service.

        Activating an already-active application changes nothing and reports
        success, so a repeated request is safe.
      x-lifecycle: experimental
      security:
        - OperatorKey: ["applications:write"]
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "200":
          $ref: "#/components/responses/ApplicationState"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/applications/{application_id}/users:
    post:
      operationId: resolveUser
      tags: [Users]
      summary: Resolve an application's person into a Convia user
      description: |
        Maps one of the application's people to a Convia user, creating the
        mapping the first time it is seen.

        The operation is idempotent by `external_subject`: calling it again
        returns the same user, so an application can call it before every
        session without tracking whether it has called it before. An existing
        user is returned unchanged, so a routine resolve never overwrites a
        display name or metadata that was corrected elsewhere.

        The response is `201` when the mapping was created and `200` when it
        already existed.

        A subject whose user was deleted stays reserved until erasure, so
        resolving it again is refused with `409` rather than reviving the user.
        A suspended user is returned normally, with its status, so the
        application can see the state it set.
      x-lifecycle: experimental
      security:
        - OperatorKey: ["tenants:write"]
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveUserRequest"
            example:
              external_subject: customer-42
              display_name: Ada Lovelace
              metadata:
                plan: pro
      responses:
        "200":
          description: The mapping already existed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "201":
          description: The mapping was created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
