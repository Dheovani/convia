        Naming an acting participant in `by` makes Convia check that person is
        a moderator of the same call, exactly as on a removal: promoting
        someone is the authority the moderator role exists for. Without one,
        the application changes the role on its own authority.

        A participant who has left cannot have their role changed, because it
        would record an authority they can no longer use.
      x-lifecycle: experimental
