        cannot stop it. An operator cannot start a call: starting a
        conversation between an application's people is not administration.

        Ending an already-ended call succeeds and returns it unchanged, so a
        client retrying after a timeout is never punished for it. Only the
        request that actually ended the call records who ended it and why; a
        repeat does not overwrite that with its own.

