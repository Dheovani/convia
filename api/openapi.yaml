components:
  securitySchemes:
    OperatorKey:
      type: http
      scheme: bearer
      description: |
        An operator authenticates with an operator credential, presented as
        `Authorization: Bearer cvo_...`.

        This is a different key from an application's, in a different table,
        with a different prefix. An application key is never accepted here and
        an operator key is never accepted on the tenant endpoints: each is
        refused on its shape, before any lookup.

        An operator credential belongs to no application, which is why these
        endpoints name the tenant in the path. Acting on someone else is what
        an operator does; the authority to do so comes from the key.

        The first operator credential cannot be issued over the API, because
        issuing one requires presenting one. It is created with
        `convia operator issue`, which requires database access.

    ApplicationKey:
      type: http
      scheme: bearer
      description: |
        An application authenticates with the API key it was issued, presented
        as `Authorization: Bearer cvk_...`.

        The key is opaque: clients must never parse it. The application Convia
        acts for is taken from the key, which is why the authenticated
        endpoints name no application in their paths.

        Every operation additionally requires the scopes listed on it. A valid
        key without the required scope is answered with `403 forbidden`.

  schemas:
    User:
      type: object
      description: |
        One application's view of one of its people.

        Convia is authoritative for `id`, `application_id`, `status`, and the
        timestamps. The remaining fields belong to the application and are
        stored without interpretation.
      required: [id, application_id, external_subject, metadata, status, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        external_subject:
          type: string
          description: |
            The identifier the application already uses for this person. Convia
            stores it opaquely and never parses it. It is scoped to the
            application, so two applications may use the same value without any
            relationship between the resulting users.
          minLength: 1
          maxLength: 255
          example: customer-42
        display_name:
          type: string
          description: Application-owned display name. Absent when none was supplied.
          minLength: 1
          maxLength: 120
          example: Ada Lovelace
        metadata:
          $ref: "#/components/schemas/UserMetadata"
        status:
          type: string
          description: |
            Lifecycle state. `active` is served normally, `suspended` retains
            data while refusing new work, and `deleted` is gone from the API.
          enum: [active, suspended, deleted]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    UserPage:
      type: object
      description: One page of users.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          type: string
          description: |
            Opaque token that returns the next page. Absent on the last page.
            Clients must not decode or construct it.

    ResolveUserRequest:
      type: object
      description: The accepted body when resolving an identity.
      required: [external_subject]
      additionalProperties: false
      properties:
        external_subject:
          type: string
          description: |
            The identifier the application uses for this person. Prefer a
            stable internal identifier over an email address: Convia stores
            whatever it receives, and an email carries personal data Convia
            does not need.
          minLength: 1
          maxLength: 255
        display_name:
          type: string
          description: Optional display name, owned by the application.
          maxLength: 120
        metadata:
          $ref: "#/components/schemas/UserMetadata"

    Credential:
      type: object
      description: |
        An API key issued to one application, without its secret.

        Convia stores only a digest of the secret, so no operation returns it
        after the credential is issued.
      required: [id, application_id, name, scopes, status, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/CredentialId"
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        name:
          type: string
          description: Operator-chosen label, so that two keys can be told apart.
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          description: The permissions this credential carries.
          minItems: 1
          items:
            $ref: "#/components/schemas/Scope"
        status:
          type: string
          description: |
            Derived from the timestamps rather than stored, so it cannot drift
            from them. Revocation outranks expiry.
          enum: [active, expired, revoked]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          $ref: "#/components/schemas/Timestamp"

    IssuedCredential:
      type: object
      description: |
        A newly issued credential together with its secret.

        This is the only representation in Convia that carries secret material,
        and it is returned exactly once.
      required: [id, application_id, name, scopes, status, created_at, secret]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/CredentialId"
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Scope"
        status:
          type: string
          enum: [active, expired, revoked]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
        secret:
          type: string
          description: |
            The complete key to present to Convia. Store it in a secret manager
            on receipt: it is not recoverable.
          pattern: "^cvk_[A-Z2-7]{26}_[A-Z2-7]{26}$"
          example: cvk_4XZQP7KN2VJH6TBWMDR3YAFC5E_YH3TKPQ2MWZC7NVJ6BXRD4FGA5

    CredentialPage:
      type: object
      description: One page of credentials.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
        next_cursor:
          type: string
          description: |
            Opaque token that continues the listing. Absent on the last page.
            Clients must never decode or construct one.

    IssueCredentialRequest:
      type: object
      description: The accepted body when issuing a credential.
      required: [name, scopes]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Operator-chosen label, so that two keys can be told apart.
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          description: |
            Required. A credential never carries implicit access, so a request
            without scopes is rejected rather than given a default.
          minItems: 1
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: |
            Optional expiry, which must be in the future. Without it the
            credential works until it is revoked.

    OperatorScope:
      type: string
      description: |
        One permission an operator credential may carry.

        Operator scopes are named separately from application scopes on
        purpose. On an application key, `users:write` means "my users". An
        operator acts on someone else's, so reusing the name would make one
        string mean two different amounts of authority depending on which key
        carried it.
      enum:
        - applications:read
        - applications:write
        - tenants:read
        - tenants:write
        - operators:read
        - operators:write

    OperatorCredentialId:
      type: string
      description: |
        Opaque identifier of an operator credential. Clients must treat it as
        opaque and must never parse it.
      pattern: "^oper_[A-Z2-7]{26}$"
      example: oper_7KQZP4XN2VJH6TBWMDR3YAFC5E

    OperatorCredential:
      type: object
      description: |
        A key that administers Convia itself, without its secret.

        It carries no `application_id`, which is the point: an operator is not
        a tenant, and nothing about this record scopes it to one.
      required: [id, name, scopes, status, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/OperatorCredentialId"
        name:
          type: string
          description: Operator-chosen label, so that two keys can be told apart.
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          description: The permissions this credential carries.
          minItems: 1
          items:
            $ref: "#/components/schemas/OperatorScope"
        status:
          type: string
          description: |
            Derived from the timestamps rather than stored, so it cannot drift
            from them. Revocation outranks expiry.
          enum: [active, expired, revoked]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          $ref: "#/components/schemas/Timestamp"

    IssuedOperatorCredential:
      type: object
      description: |
        A newly issued operator credential together with its secret, returned
        exactly once.
      required: [id, name, scopes, status, created_at, secret]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/OperatorCredentialId"
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OperatorScope"
        status:
          type: string
          enum: [active, expired, revoked]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
        secret:
          type: string
          description: |
            The complete key to present to Convia. Store it in a secret manager
            on receipt: it is not recoverable.
          pattern: "^cvo_[A-Z2-7]{26}_[A-Z2-7]{26}$"
          example: cvo_4XZQP7KN2VJH6TBWMDR3YAFC5E_YH3TKPQ2MWZC7NVJ6BXRD4FGA5

    OperatorCredentialPage:
      type: object
      description: One page of operator credentials.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OperatorCredential"
        next_cursor:
          type: string
          description: |
            Opaque token that continues the listing. Absent on the last page.
            Clients must never decode or construct one.

    IssueOperatorCredentialRequest:
      type: object
      description: The accepted body when issuing an operator credential.
      required: [name, scopes]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Operator-chosen label, so that two keys can be told apart.
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          description: |
            Required, and must be a subset of the scopes the calling key holds.
            Without that rule a key carrying only `operators:write` could mint
            one carrying authority over every tenant in Convia.
          minItems: 1
          items:
            $ref: "#/components/schemas/OperatorScope"
        expires_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: |
            Optional expiry, which must be in the future. Without it the
            credential works until it is revoked.

    RoomMetadata:
      type: object
      description: |
        Application-owned key-value data that Convia stores without
        interpreting. The rules are identical to `UserMetadata`, deliberately:
        metadata means the same thing in both places, and a client that learned
        the rules for a user should not have to learn them again for a room.

        At most 16 entries, keys of at most 40 characters made of lowercase
        letters, digits, and underscores and starting with a letter, values of
        at most 256 characters, and at most 4096 bytes in total.

        Values are strings only: nested objects and arrays are rejected so the
        stored shape stays predictable.
      additionalProperties:
        type: string
        maxLength: 256
      example:
        team: platform
        recurring: weekly

    RoomId:
      type: string
      description: |
        Opaque identifier of a room. Clients must treat it as opaque and must
        never parse it.
      pattern: "^room_[A-Z2-7]{26}$"
      example: room_7KQZP4XN2VJH6TBWMDR3YAFC5E

    RoomStatus:
      type: string
      description: |
        The lifecycle state of a room.

        Rooms use `open` and `closed` rather than the `active` and `suspended`
        of applications and users, because the words describe what an operator
        is doing: a closed room is not being punished, it is finished.
      enum: [open, closed, deleted]

    RoomAlias:
      type: string
      description: |
        The stable name an application gave a room, unique within that
        application. It carries no whitespace, because a value that rendered
        identically to another would make two rooms indistinguishable in a
        listing while remaining distinct keys.

        Absent on an anonymous room, which is addressed only by its identifier.
      minLength: 1
      maxLength: 120
      example: weekly-standup

    Room:
      type: object
      description: |
        A place an application's people meet.

        A room is durable: it outlives any single conversation held in it.
        Convia is authoritative for `id`, `application_id`, `status`, and the
        timestamps. The remaining fields belong to the application.
      required: [id, application_id, name, metadata, status, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/RoomId"
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        alias:
          $ref: "#/components/schemas/RoomAlias"
        name:
          type: string
          description: The label a person reads. Free text, unlike the alias.
          minLength: 1
          maxLength: 120
        metadata:
          $ref: "#/components/schemas/RoomMetadata"
        max_participants:
          type: integer
          description: |
            The capacity the application asked for, absent when the room states
            no limit of its own. Convia records it; the media plane enforces it
            once calls exist.
          minimum: 1
          maximum: 1000
        status:
          $ref: "#/components/schemas/RoomStatus"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    RoomPage:
      type: object
      description: One page of rooms.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Room"
        next_cursor:
          type: string
          description: |
            Opaque token that continues the listing. Absent on the last page.
            Clients must never decode or construct one.

    CreateRoomRequest:
      type: object
      description: The accepted body when creating a room.
      required: [name]
      additionalProperties: false
      properties:
        alias:
          $ref: "#/components/schemas/RoomAlias"
        name:
          type: string
          minLength: 1
          maxLength: 120
        metadata:
          $ref: "#/components/schemas/RoomMetadata"
        max_participants:
          type: integer
          minimum: 1
          maximum: 1000

    UpdateRoomRequest:
      type: object
      description: |
        The accepted body when changing a room.

        Omitting a field leaves it alone; sending it empty clears it. At least
        one field is required, because a request that changes nothing is more
        likely a mistake than an intention.
      minProperties: 1
      additionalProperties: false
      properties:
        alias:
          type: string
          description: |
            The new alias, or an empty string to make the room anonymous.
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 120
        metadata:
          $ref: "#/components/schemas/RoomMetadata"
        max_participants:
          type: integer
          nullable: true
          description: |
            The new capacity, or null to remove the room-level limit.
          minimum: 1
          maximum: 1000

    Scope:
      type: string
      description: |
        One permission a credential may carry. Scopes name Convia domain
        operations rather than HTTP routes, so a permission keeps its meaning
        when a route is added, renamed, or split.
      enum:
        - users:read
        - users:write
        - credentials:read
        - credentials:write
        - rooms:read
        - rooms:write

    CredentialId:
      type: string
      description: |
        Opaque, immutable public identifier. It is not secret: it travels
        inside the key and appears in listings and audit records.
      pattern: "^cred_[A-Z2-7]{26}$"
      example: cred_4XZQP7KN2VJH6TBWMDR3YAFC5E

    UpdateUserRequest:
      type: object
      description: |
        The accepted body when changing the attributes an application owns.

        Only the fields present in the body change; an omitted field keeps its
        stored value. Sending `display_name` as an empty string clears it, and
        `metadata` is replaced wholesale rather than merged, so a key is removed
        by sending the object without it.

        At least one field must be present.
      minProperties: 1
      additionalProperties: false
      properties:
        display_name:
          type: string
          description: Optional display name, owned by the application.
          maxLength: 120
        metadata:
          $ref: "#/components/schemas/UserMetadata"

    UserMetadata:
      type: object
      description: |
        Application-owned key-value data that Convia stores without
        interpreting. At most 16 entries, keys of at most 40 characters made of
        lowercase letters, digits, and underscores and starting with a letter,
        values of at most 256 characters, and at most 4096 bytes in total.

        Values are strings only: nested objects and arrays are rejected so the
        stored shape stays predictable. An application that wants an avatar
        stores its URL here.
      additionalProperties:
        type: string
        maxLength: 256
      example:
        plan: pro
        avatar_url: https://example.test/avatars/42.png

    UserId:
      type: string
      description: |
        Opaque, immutable public identifier. Clients store it as a reference and
        must never parse it.
      pattern: "^usr_[A-Z2-7]{26}$"
      example: usr_7KQZP4XN2VJH6TBWMDR3YAFC5E

    Application:
      type: object
      description: A Convia tenant.
      required: [id, name, status, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/ApplicationId"
        name:
          type: string
          description: Display name. It carries no security meaning.
          minLength: 1
          maxLength: 120
          example: Workspace Town
        status:
          type: string
          description: |
            Lifecycle state. `active` is served normally, `suspended` retains
            data while refusing new work, and `deleted` is gone from the API.
          enum: [active, suspended, deleted]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    ApplicationPage:
      type: object
      description: One page of applications.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        next_cursor:
          type: string
          description: |
            Opaque token that returns the next page. Absent on the last page.
            Clients must not decode or construct it.

    RenameApplicationRequest:
      type: object
      description: The accepted body when renaming an application.
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: |
            New display name. Surrounding whitespace is insignificant, and
            control characters are rejected.
          minLength: 1
          maxLength: 120

    CreateApplicationRequest:
      type: object
      description: The accepted body when creating an application.
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: |
            Display name. Surrounding whitespace is insignificant, and control
            characters are rejected.
          minLength: 1
          maxLength: 120

    ApplicationId:
      type: string
      description: |
        Opaque, immutable public identifier. Clients store it as a reference and
        must never parse it.
      pattern: "^app_[A-Z2-7]{26}$"
      example: app_MXHJAY4MJNX2FO22XWJ3XNCKHT

    Timestamp:
      type: string
      format: date-time
      description: UTC RFC 3339 timestamp with millisecond precision.
      example: "2026-09-05T14:04:56.154Z"

    Readiness:
      type: object
      description: Readiness of Convia and of each dependency it requires.
      required: [status, checks]
      additionalProperties: false
      properties:
        status:
          type: string
          description: Aggregate readiness. `ready` only when every check passes.
          enum: [ready, unavailable]
        checks:
          type: object
          description: Result of each dependency check, keyed by dependency name.
          additionalProperties:
            type: string
            enum: [ok, unavailable]

    Health:
      type: object
      description: Health of the Convia process.
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          description: Always `ok` when the process can serve requests.
          enum: [ok]

    ErrorCode:
      type: string
      description: |
        Stable, machine-readable identifier of a failure. Clients branch on this
        value rather than on the human-readable message. Adding a code is an
        additive change; changing the meaning of an existing code is breaking.
      enum:
        - invalid_request
        - malformed_json
        - unsupported_media_type
        - payload_too_large
        - unauthenticated
        - forbidden
        - not_found
        - method_not_allowed
        - precondition_failed
        - conflict
        - rate_limited
        - internal_error

    Error:
      type: object
      description: |
        The single error representation used by every Convia failure, including
        failures produced by routing and middleware.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: |
                Human-readable description for developers. It may change at any
                time and must never be parsed or matched by clients.
            request_id:
              type: string
              description: |
                Correlation identifier of the failed request, matching the
                `X-Request-ID` response header. Quote it in support requests.

  parameters:
    ApplicationID:
      name: application_id
      in: path
      required: true
      description: Identifier of the application.
      schema:
        $ref: "#/components/schemas/ApplicationId"

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A client-generated key that makes a retry safe.

        A client that receives no response cannot tell whether its request was
        lost on the way out or on the way back. Presenting a key means the
        operation is performed at most once: a repeat of the same request
        returns the original response, including its original status.

        - The key is opaque to Convia and at most 255 characters.
        - A repeat of the same request replays the original response.
        - A repeat carrying a different body is refused with `409 conflict`.
        - A repeat arriving while the first is still running is refused with
          `409 conflict`, and succeeds once the first has finished.
        - Keys are remembered for at least 24 hours. Past that window, the same
          key is treated as a new request.
        - Keys belong to the caller that presented them, so two callers using
          the same value never meet.

        A response the server may give differently on the next attempt -- an
        internal error, or a rate-limited refusal -- is not stored, so a retry
        after one is a real attempt rather than a replayed failure.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 6f1a7b3e-2c4d-4e8a-9f01-2b3c4d5e6f70

    UserID:
      name: user_id
      in: path
      required: true
      description: Identifier of the user, within the application in the path.
      schema:
        $ref: "#/components/schemas/UserId"

    CredentialID:
      name: credential_id
      in: path
      required: true
      description: The credential's opaque identifier.
      schema:
        $ref: "#/components/schemas/CredentialId"

    OperatorCredentialID:
      name: credential_id
      in: path
      required: true
      description: The operator credential's opaque identifier.
      schema:
        $ref: "#/components/schemas/OperatorCredentialId"

    RoomID:
      name: room_id
      in: path
      required: true
      description: The room's opaque identifier.
      schema:
        $ref: "#/components/schemas/RoomId"

    RoomStatusFilter:
      name: status
      in: query
      required: false
      description: |
        Return only rooms in this lifecycle state. Without it, deleted rooms are
        excluded and everything else is returned.
      schema:
        $ref: "#/components/schemas/RoomStatus"

    RoomAliasFilter:
      name: alias
      in: query
      required: false
      description: |
        Return the single room holding this alias instead of a page. The result
        is still delivered in the `data` array, so one response shape serves
        both forms of the request.
      schema:
        $ref: "#/components/schemas/RoomAlias"

    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Entity tag from a previous read. When present, the update applies only
        while the resource still carries that version. Only a strong validator
        is honored; `*` and weak validators are treated as no condition.
      schema:
        type: string
      example: '"9f2c1d4b8a3e5f60"'

    Limit:
      name: limit
      in: query
      required: false
      description: |
        Maximum number of items to return in one page. Values above the maximum
        are rejected with `invalid_request` rather than silently clamped.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 25

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque continuation token returned by a previous page. Clients must not
        construct, decode, or persist cursors beyond the paging sequence.
      schema:
        type: string
        maxLength: 512

  headers:
    RequestId:
      description: |
        Correlation identifier of the request. Convia echoes a safe
        client-supplied `X-Request-ID` and otherwise generates one.
      required: true
      schema:
        type: string
        maxLength: 128

    Allow:
      description: Methods supported by the requested resource.
      required: true
      schema:
        type: string

    ETag:
      description: |
        Opaque version of the returned resource. Send it back as `If-Match` to
        make a later update conditional. Clients compare it, never parse it.
      required: true
      schema:
        type: string

    Deprecation:
      description: |
        Present when the operation is deprecated. Carries the date the
        deprecation took effect, as an IMF-fixdate.
      required: false
      schema:
        type: string

    Sunset:
      description: |
        Present when a removal date has been announced. Carries the earliest
        date the operation may stop working, as an IMF-fixdate.
      required: false
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        The request violates the endpoint contract, or its body is not valid
        JSON. Returned with `invalid_request` or `malformed_json`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_request
              message: The request body must not be empty.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    NotFound:
      description: The requested route or resource does not exist.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: The requested resource does not exist.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    MethodNotAllowed:
      description: The route exists but does not support the request method.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Allow:
          $ref: "#/components/headers/Allow"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: method_not_allowed
              message: The requested method is not supported by this resource.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    ApplicationState:
      description: The application, after the requested lifecycle change.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Application"

    Unauthorized:
      description: |
        The request carried no usable credential.

        Every reason a key can fail — absent, malformed, unknown, wrong,
        revoked, expired, or belonging to an application Convia no longer
        serves — produces this same answer, so the response cannot be used to
        learn which keys exist or which were once valid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          description: The authentication scheme to use.
          schema:
            type: string
            example: Bearer realm="convia"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthenticated
              message: The request did not carry a usable credential.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    RateLimited:
      description: |
        Too many failed authentication attempts from this caller.

        Only failures are counted, so a client presenting a working key never
        meets this. A client that does is presenting one that will not start
        working by being repeated — a revoked or expired key in a retry loop,
        most often — and should read `Retry-After` and back off.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: Whole seconds to wait before attempting again.
          schema:
            type: integer
            minimum: 1
            example: 6
        WWW-Authenticate:
          description: The authentication scheme to use.
          schema:
            type: string
            example: Bearer realm="convia"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: rate_limited
              message: Too many failed authentication attempts. Retry later.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    Forbidden:
      description: |
        The credential is valid but does not carry the scope this operation
        requires. Presenting a different key will not help; being granted the
        scope will.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: forbidden
              message: The credential does not carry the scope this operation requires.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    UserState:
      description: The user, after the requested lifecycle change.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/User"

    Conflict:
      description: |
        The request is valid but cannot be satisfied in the current state of the
        resource, and repeating it unchanged will not help.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: conflict
              message: The external subject belongs to a deleted user and stays reserved until erasure.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    PreconditionFailed:
      description: |
        The `If-Match` version no longer describes the stored resource, so
        another request changed it first. Nothing was modified.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: precondition_failed
              message: The application was modified by another request. Read it again and retry.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    PayloadTooLarge:
      description: The request body exceeds the accepted size.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: payload_too_large
              message: The request body must not exceed 1048576 bytes.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    UnsupportedMediaType:
      description: The request does not declare an `application/json` body.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unsupported_media_type
              message: The request Content-Type must be application/json.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    InternalError:
      description: |
        The server encountered an unexpected condition. The response never
        contains internal detail; the `request_id` correlates it with the logs.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal_error
              message: The server encountered an unexpected condition.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT
