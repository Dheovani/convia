      description: |
        Returns everything Convia tried to send the caller, newest first,
        optionally narrowed to one endpoint.

        This is the audit trail a webhook has and a stream does not: an
        application can ask what it was told, when, how many times Convia
        tried, and what the destination answered.
      x-lifecycle: experimental
      security:
        - ApplicationKey: ["webhooks:read"]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: endpoint_id
          in: query
          required: false
          description: Narrows the listing to one endpoint.
          schema:
            $ref: "#/components/schemas/WebhookEndpointId"
      responses:
        "200":
          description: One page of deliveries.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/deliveries/{delivery_id}:
    get:
      operationId: getWebhookDelivery
      tags: [Webhooks]
      summary: Retrieve a webhook delivery
      description: |
        Returns one delivery: which event it carried, how many attempts it
        took, and what happened to it.

        The body that was sent is not included. It is the event, which the
        application already received or can read from the resource itself, and
        repeating it here would keep the same content in a second place with a
        different lifetime.
