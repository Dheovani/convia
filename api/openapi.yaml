  /v1/rooms/{room_id}/members/{user_id}:
    put:
      operationId: addOwnRoomMember
      tags: [Members]
      summary: Give somebody a place in a room
      description: |
        Gives one of the caller's own people a place in one of its rooms.

        **Membership gates people, not applications.** An application's key
        already carries full authority over its own rooms; requiring it to add
        itself before posting a deployment notice would be ceremony that
        protects nobody. Membership is what the session surface checks, where
        somebody acts as themselves. The key says which application is calling;
        membership says which of its people may be where.

        A `PUT` on the person's own address rather than a `POST` to a
        collection, because the operation is **idempotent by the person**:
        adding somebody twice is the same outcome as adding them once, and a
        collection `POST` would promise a new resource each time. It answers
        `201` the first time and `200` afterwards, so a caller reconciling its
        own list against Convia's can tell whether it changed anything without
        comparing timestamps.

        A **closed** room still accepts members: closing stops new calls and new
        messages, it does not evict the people who were there, and adding
        somebody to a finished room so they can read its history is reasonable.
        A **deleted** room answers `404 not found`.

        A suspended person answers `409 conflict`. Suspension withdraws access,
        and handing somebody a room to write in would be the one place it did
        not.

        This needs `members:write` and **not** `rooms:write`. A credential that
        creates and renames rooms has never been able to touch people, and
        folding membership into it would silently widen every key already
        issued into one that can put anybody anywhere.
      x-lifecycle: experimental
      security:
        - ApplicationKey: ["members:write"]
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: They were already a member.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomMember"
        "201":
          description: They were given a place.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    delete:
      operationId: removeOwnRoomMember
      tags: [Members]
      summary: Take away a place in a room
      description: |
        Takes somebody's place in one of the caller's own rooms away.

        **Nothing happens to what they said.** The messages are the room's
        record of a conversation that did happen, and withdrawing them would
        rewrite it for everybody still there. Removing a person from the record
        entirely is erasure, which is a different act and the person's to ask
        for.

        Removing somebody who was not a member answers `204` like any other
        removal: the caller asked for a state the room is already in, and a
        retried request must not look like a mistake.
      x-lifecycle: experimental
      security:
        - ApplicationKey: ["members:write"]
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: They have no place in the room.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/rooms/{room_id}/members:
    get:
      operationId: listOwnRoomMembers
      tags: [Members]
      summary: List who belongs to a room
      description: |
        Returns one page of who belongs to one of the caller's own rooms.

        Ordered by the person rather than by when they joined, because that is
        the order the primary key already holds: a membership list has no
        chronology a reader cares about, and sorting one into existence would
        cost a sort on every page. The cursor is therefore the last `user_id`
        on the page.

        A member carries **no display name**, for the reason a call roster does
        not: copying one here would put a person's name where nobody asked for
        it and would duplicate something the application owns and can change. A
        caller that wants a name reads the user.
      x-lifecycle: experimental
      security:
        - ApplicationKey: ["members:read"]
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/MembershipCursor"
