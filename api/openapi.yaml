        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PresenceUnavailable"

  /v1/events:
    get:
      operationId: streamEvents
      tags: [Events]
      summary: Open a live control-event stream
      description: |
        Upgrades the connection to a WebSocket and delivers the caller's own
        control events as they happen.

        **Everything that decides what the stream carries happens before the
        upgrade.** The tenant is the one the credential proves, and the set of
        event types is derived from the scopes the credential already holds:
        `events:read` grants the connection, and each event is delivered only
        to a credential that could have read the thing it is about — call
        events need `calls:read`, participant events need `participants:read`,
        invitation events need `invitations:read`, message events need
        `messages:read`, membership events need `members:read`, and presence
        events need `presence:read`. A credential granted
        `events:read` and no read scope is refused rather than given a
        connection that could never carry anything.

        The subscription cannot be changed afterwards, because the stream is
        one direction. A client that sends any message has its connection
        closed with `1003`.

        **Events are not stored.** One produced while a client is disconnected
        is not waiting for it when it returns. A client that reconnects, and
        any client told its stream fell behind, should re-read the calls it
        cares about over REST. `docs/events.md` states this and the close codes
        in full.
      x-lifecycle: experimental
      security:
        - ApplicationKey: ["events:read"]
      parameters:
        - name: Connection
          in: header
          required: true
          description: Must be `Upgrade`.
          schema:
            type: string
        - name: Upgrade
          in: header
          required: true
          description: Must be `websocket`.
          schema:
            type: string
        - name: Sec-WebSocket-Version
          in: header
          required: true
          description: Must be `13`, the version RFC 6455 defines.
          schema:
            type: string
        - name: Sec-WebSocket-Key
          in: header
          required: true
          description: The client's handshake nonce, as RFC 6455 requires.
          schema:
            type: string
      responses:
        "101":
          description: |
            The connection is now a WebSocket carrying `Event` objects as text
            messages, one event per message.

            Convia sends a ping every 30 seconds and closes the connection if
            it is not answered within 10. Nothing is expected from the client
            beyond the pong its WebSocket implementation sends for it.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/invitations/{invitation_id}/revoke:
    post:
      operationId: revokeOwnInvitation
      tags: [Invitations]
      summary: Withdraw an invitation
      description: |
        Stops an invitation being used, immediately.

        Revocation outranks everything, including a redemption that already
        happened: the ordinary reason to withdraw one is that it reached
        somebody it should not have, and a link that kept working after that
        would defeat the purpose.

        **It does not remove anyone already in the call.** Somebody who joined
        is a participant, and putting them out is a decision about a
        participant rather than about the invitation they arrived with. Remove
        them through the participant endpoints.

        Revoking twice succeeds and changes nothing, so a retry after a timeout
        is never punished.
      x-lifecycle: experimental
      security:
        - ApplicationKey: ["invitations:write"]
      parameters:
        - $ref: "#/components/parameters/InvitationID"
      responses:
        "200":
          description: The invitation, now withdrawn.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/invitation/redeem:
    post:
      operationId: redeemInvitation
      tags: [Invitations]
      summary: Redeem the presented invitation
      description: |
        Turns the invitation into a place in the call and the means to connect.

        **This endpoint is authenticated by the invitation itself**, not by an
        application key. It is the only surface in Convia where the caller is
        the person the request is about, and that is the whole point: an
        invitation is only authorization when the party presenting it is not
        the party that granted it.

        No identifier appears in the path. The presented key names itself, and
        asking the holder to repeat it would let them address one they do not
        hold.

        Both a participation and a connection credential come back in one
        response, because the holder has no way to obtain either separately:
        they hold an invitation, not an API key.

        **Redeeming again is expected**, not an error. Somebody whose
        connection dropped opens the same link again and arrives at the
        participation they already had, with a fresh credential. What stops an
        invitation is time, a revocation, or having declined it — and those are
        reported as one answer, because the holder is not the party that issued
        it and should not learn which happened.
      x-lifecycle: experimental
      security:
        - InvitationKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: The participation and the credential to connect with.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redemption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/invitation/decline:
    post:
      operationId: declineInvitation
      tags: [Invitations]
      summary: Decline the presented invitation
      description: |
        Records that the holder said no. It is terminal.

        Declining is the invitee's own act, and it is deliberately not the same
        as the application withdrawing the invitation: a record that confused
        the two would be wrong about who changed their mind.

        Declining after redeeming is refused, because the person is already in
        the call and a decline would record something that did not happen.

        Declining twice succeeds and changes nothing.
      x-lifecycle: experimental
      security:
        - InvitationKey: []
      responses:
        "200":
          description: The invitation, now declined.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-convia_session
      description: |
        A person signs in to Convia's own interface and holds a session cookie.

        This is a fourth family of credential, alongside an application's, an
        operator's, and an invitation's, and it is the only one that is not a
        bearer token in a header. It is never accepted in an `Authorization`
        header and the other three are never accepted here — each surface reads
        only its own kind, so a credential offered to the wrong one is not
        rejected so much as never looked at.

        **It carries no scopes.** An application key holds authority over a
        whole tenant; a session proves who one person is. What that person may
        do is decided per operation rather than by a scope list, which is what
        keeps signing in from being a way to obtain an application's authority.

        Convia stores only a digest, so a copy of the database yields no
        working sessions, and revocation takes effect on the next request
        because Convia is the only party that verifies it.

    PeerSignature:
      type: apiKey
      in: header
      name: Convia-Signature
      description: |
        Another installation acting for one person, proved by a signature with that person's key.

        Five headers travel together: `Convia-Account` (the account identifier), `Convia-Public-Key` (the Ed25519 public key, base64), `Convia-Timestamp` (Unix seconds), `Convia-Nonce` (26 base32 characters), and `Convia-Signature` (base64). The signature covers, one per line: `convia-peer-v1`, the method, the authority the request was addressed to, the path and query, the lowercase hex SHA-256 of the body, the account identifier, the timestamp, and the nonce.

        The home accepts it only when the key's fingerprint is the account identifier, the signature verifies, the timestamp is within five minutes of its own clock, and the nonce has not been seen. The authority is signed so that a home cannot replay a request it received to another installation.

        Nothing is issued and nothing is stored but the nonce. On the invitation routes the signer may be anybody; on the room routes they must already be a member, made by accepting an invitation.

    InvitationKey:
      type: http
      scheme: bearer
      description: |
        The holder of an invitation authenticates with the invitation itself,
        presented as `Authorization: Bearer cvi_...`.

        It is a third family of key, alongside an application's and an
        operator's, with its own prefix and its own table. An application key
        is never accepted on these routes and an invitation is never accepted
        anywhere else: each is refused on its shape, before any lookup.

        It carries no scopes. What an invitation permits — one person, one
        call, one role — is fixed when it is issued, so there is nothing for a
        caller to ask for.

        Convia issues it once and stores only a digest. Treat it as a
        credential belonging to the person it was sent to.

    OperatorKey:
      type: http
      scheme: bearer
      description: |
        An operator authenticates with an operator credential, presented as
        `Authorization: Bearer cvo_...`.

        This is a different key from an application's, in a different table,
        with a different prefix. An application key is never accepted here and
        an operator key is never accepted on the tenant endpoints: each is
        refused on its shape, before any lookup.

        An operator credential belongs to no application, which is why these
        endpoints name the tenant in the path. Acting on someone else is what
        an operator does; the authority to do so comes from the key.

        The first operator credential cannot be issued over the API, because
        issuing one requires presenting one. It is created with
        `convia operator issue`, which requires database access.

    ApplicationKey:
      type: http
      scheme: bearer
      description: |
        An application authenticates with the API key it was issued, presented
        as `Authorization: Bearer cvk_...`.

        The key is opaque: clients must never parse it. The application Convia
        acts for is taken from the key, which is why the authenticated
        endpoints name no application in their paths.

        Every operation additionally requires the scopes listed on it. A valid
        key without the required scope is answered with `403 forbidden`.

  schemas:
    User:
      type: object
      description: |
        One application's view of one of its people.

        Convia is authoritative for `id`, `application_id`, `status`, and the
        timestamps. The remaining fields belong to the application and are
        stored without interpretation.
      required: [id, application_id, external_subject, metadata, status, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        external_subject:
          type: string
          description: |
            The identifier the application already uses for this person. Convia
            stores it opaquely and never parses it. It is scoped to the
            application, so two applications may use the same value without any
            relationship between the resulting users.
          minLength: 1
          maxLength: 255
          example: customer-42
        display_name:
          type: string
          description: Application-owned display name. Absent when none was supplied.
          minLength: 1
          maxLength: 120
          example: Ada Lovelace
        metadata:
          $ref: "#/components/schemas/UserMetadata"
        status:
          type: string
          description: |
            Lifecycle state. `active` is served normally, `suspended` retains
            data while refusing new work, and `deleted` is gone from the API.
          enum: [active, suspended, deleted]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    UserPage:
      type: object
      description: One page of users.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          type: string
          description: |
            Opaque token that returns the next page. Absent on the last page.
            Clients must not decode or construct it.

    ResolveUserRequest:
      type: object
      description: The accepted body when resolving an identity.
      required: [external_subject]
      additionalProperties: false
      properties:
        external_subject:
          type: string
          description: |
            The identifier the application uses for this person. Prefer a
            stable internal identifier over an email address: Convia stores
            whatever it receives, and an email carries personal data Convia
            does not need.
          minLength: 1
          maxLength: 255
        display_name:
          type: string
          description: Optional display name, owned by the application.
          maxLength: 120
        metadata:
          $ref: "#/components/schemas/UserMetadata"

    Credential:
      type: object
      description: |
        An API key issued to one application, without its secret.

        Convia stores only a digest of the secret, so no operation returns it
        after the credential is issued.
      required: [id, application_id, name, scopes, status, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/CredentialId"
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        name:
          type: string
          description: Operator-chosen label, so that two keys can be told apart.
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          description: The permissions this credential carries.
          minItems: 1
          items:
            $ref: "#/components/schemas/Scope"
        status:
          type: string
          description: |
            Derived from the timestamps rather than stored, so it cannot drift
            from them. Revocation outranks expiry.
          enum: [active, expired, revoked]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          $ref: "#/components/schemas/Timestamp"

    IssuedCredential:
      type: object
      description: |
        A newly issued credential together with its secret.

        This is the only representation in Convia that carries secret material,
        and it is returned exactly once.
      required: [id, application_id, name, scopes, status, created_at, secret]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/CredentialId"
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Scope"
        status:
          type: string
          enum: [active, expired, revoked]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
        secret:
          type: string
          description: |
            The complete key to present to Convia. Store it in a secret manager
            on receipt: it is not recoverable.
          pattern: "^cvk_[A-Z2-7]{26}_[A-Z2-7]{26}$"
          example: cvk_4XZQP7KN2VJH6TBWMDR3YAFC5E_YH3TKPQ2MWZC7NVJ6BXRD4FGA5

    CredentialPage:
      type: object
      description: One page of credentials.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
        next_cursor:
          type: string
          description: |
            Opaque token that continues the listing. Absent on the last page.
            Clients must never decode or construct one.

    IssueCredentialRequest:
      type: object
      description: The accepted body when issuing a credential.
      required: [name, scopes]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Operator-chosen label, so that two keys can be told apart.
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          description: |
            Required. A credential never carries implicit access, so a request
            without scopes is rejected rather than given a default.
          minItems: 1
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: |
            Optional expiry, which must be in the future. Without it the
            credential works until it is revoked.

    OperatorScope:
      type: string
      description: |
        One permission an operator credential may carry.

        Operator scopes are named separately from application scopes on
        purpose. On an application key, `users:write` means "my users". An
        operator acts on someone else's, so reusing the name would make one
        string mean two different amounts of authority depending on which key
        carried it.
      enum:
        - applications:read
        - applications:write
        - tenants:read
        - tenants:write
        - operators:read
        - operators:write

    OperatorCredentialId:
      type: string
      description: |
        Opaque identifier of an operator credential. Clients must treat it as
        opaque and must never parse it.
      pattern: "^oper_[A-Z2-7]{26}$"
      example: oper_7KQZP4XN2VJH6TBWMDR3YAFC5E

    OperatorCredential:
      type: object
      description: |
        A key that administers Convia itself, without its secret.

        It carries no `application_id`, which is the point: an operator is not
        a tenant, and nothing about this record scopes it to one.
      required: [id, name, scopes, status, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/OperatorCredentialId"
        name:
          type: string
          description: Operator-chosen label, so that two keys can be told apart.
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          description: The permissions this credential carries.
          minItems: 1
          items:
            $ref: "#/components/schemas/OperatorScope"
        status:
          type: string
          description: |
            Derived from the timestamps rather than stored, so it cannot drift
            from them. Revocation outranks expiry.
          enum: [active, expired, revoked]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          $ref: "#/components/schemas/Timestamp"

    IssuedOperatorCredential:
      type: object
      description: |
        A newly issued operator credential together with its secret, returned
        exactly once.
      required: [id, name, scopes, status, created_at, secret]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/OperatorCredentialId"
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OperatorScope"
        status:
          type: string
          enum: [active, expired, revoked]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
        secret:
          type: string
          description: |
            The complete key to present to Convia. Store it in a secret manager
            on receipt: it is not recoverable.
          pattern: "^cvo_[A-Z2-7]{26}_[A-Z2-7]{26}$"
          example: cvo_4XZQP7KN2VJH6TBWMDR3YAFC5E_YH3TKPQ2MWZC7NVJ6BXRD4FGA5

    OperatorCredentialPage:
      type: object
      description: One page of operator credentials.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OperatorCredential"
        next_cursor:
          type: string
          description: |
            Opaque token that continues the listing. Absent on the last page.
            Clients must never decode or construct one.

    IssueOperatorCredentialRequest:
      type: object
      description: The accepted body when issuing an operator credential.
      required: [name, scopes]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Operator-chosen label, so that two keys can be told apart.
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          description: |
            Required, and must be a subset of the scopes the calling key holds.
            Without that rule a key carrying only `operators:write` could mint
            one carrying authority over every tenant in Convia.
          minItems: 1
          items:
            $ref: "#/components/schemas/OperatorScope"
        expires_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: |
            Optional expiry, which must be in the future. Without it the
            credential works until it is revoked.

    RoomMetadata:
      type: object
      description: |
        Application-owned key-value data that Convia stores without
        interpreting. The rules are identical to `UserMetadata`, deliberately:
        metadata means the same thing in both places, and a client that learned
        the rules for a user should not have to learn them again for a room.

        At most 16 entries, keys of at most 40 characters made of lowercase
        letters, digits, and underscores and starting with a letter, values of
        at most 256 characters, and at most 4096 bytes in total.

        Values are strings only: nested objects and arrays are rejected so the
        stored shape stays predictable.
      additionalProperties:
        type: string
        maxLength: 256
      example:
        team: platform
        recurring: weekly

    RoomId:
      type: string
      description: |
        Opaque identifier of a room. Clients must treat it as opaque and must
        never parse it.
      pattern: "^room_[A-Z2-7]{26}$"
      example: room_7KQZP4XN2VJH6TBWMDR3YAFC5E

    RoomStatus:
      type: string
      description: |
        The lifecycle state of a room.

        Rooms use `open` and `closed` rather than the `active` and `suspended`
        of applications and users, because the words describe what an operator
        is doing: a closed room is not being punished, it is finished.
      enum: [open, closed, deleted]

    RoomAlias:
      type: string
      description: |
        The stable name an application gave a room, unique within that
        application. It carries no whitespace, because a value that rendered
        identically to another would make two rooms indistinguishable in a
        listing while remaining distinct keys.

        Absent on an anonymous room, which is addressed only by its identifier.
      minLength: 1
      maxLength: 120
      example: weekly-standup

    Room:
      type: object
      description: |
        A place an application's people meet.

        A room is durable: it outlives any single conversation held in it.
        Convia is authoritative for `id`, `application_id`, `status`, and the
        timestamps. The remaining fields belong to the application.
      required: [id, application_id, name, metadata, status, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/RoomId"
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        alias:
          $ref: "#/components/schemas/RoomAlias"
        name:
          type: string
          description: The label a person reads. Free text, unlike the alias.
          minLength: 1
          maxLength: 120
        metadata:
          $ref: "#/components/schemas/RoomMetadata"
        max_participants:
          type: integer
          description: |
            The capacity the application asked for, absent when the room states
            no limit of its own. Convia records it; the media plane enforces it
            once calls exist.
          minimum: 1
          maximum: 1000
        status:
          $ref: "#/components/schemas/RoomStatus"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    RoomPage:
      type: object
      description: One page of rooms.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Room"
        next_cursor:
          type: string
          description: |
            Opaque token that continues the listing. Absent on the last page.
            Clients must never decode or construct one.

    CreateRoomRequest:
      type: object
      description: The accepted body when creating a room.
      required: [name]
      additionalProperties: false
      properties:
        alias:
          $ref: "#/components/schemas/RoomAlias"
        name:
          type: string
          minLength: 1
          maxLength: 120
        metadata:
          $ref: "#/components/schemas/RoomMetadata"
        max_participants:
          type: integer
          minimum: 1
          maximum: 1000

    UpdateRoomRequest:
      type: object
      description: |
        The accepted body when changing a room.

        Omitting a field leaves it alone; sending it empty clears it. At least
        one field is required, because a request that changes nothing is more
        likely a mistake than an intention.
      minProperties: 1
      additionalProperties: false
      properties:
        alias:
          type: string
          description: |
            The new alias, or an empty string to make the room anonymous.
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 120
        metadata:
          $ref: "#/components/schemas/RoomMetadata"
        max_participants:
          type: integer
          nullable: true
          description: |
            The new capacity, or null to remove the room-level limit.
          minimum: 1
          maximum: 1000

    CallId:
      type: string
      description: |
        Opaque identifier of a call. Clients must treat it as opaque and must
        never parse it.
      pattern: "^call_[A-Z2-7]{26}$"
      example: call_7KQZP4XN2VJH6TBWMDR3YAFC5E

    CallStatus:
      type: string
      description: |
        The lifecycle state of a call. There are two, and both are reachable: a
        conversation is happening, or it is over. `ended` is terminal.

        Convia deliberately does not model `ringing`, `ending`, or `failed`.
        Ringing describes someone being summoned, which needs invitations.
        Ending describes a teardown in flight, which needs a media plane to be
        tearing anything down. Failed describes a call that could not be
        established, which needs something that can fail to establish one. Each
        would be a state nothing could enter, and a lifecycle with unreachable
        states teaches a client rules that are not true.

        Why a call ended is reported as `end_reason` rather than as a state.
      enum: [active, ended]

    CallActor:
      type: string
      description: |
        Who caused a transition. It names the authority that made the request,
        not the person who was talking.
      enum: [application, operator]

    CallMetadata:
      type: object
      description: |
        Application-owned key-value data that Convia stores without
        interpreting. The rules are identical to `RoomMetadata` and
        `UserMetadata`, deliberately: metadata means the same thing in all
        three, and a client should not have to learn the rules three times.

        At most 16 entries, keys of at most 40 characters made of lowercase
        letters, digits, and underscores and starting with a letter, values of
        at most 256 characters, and at most 4096 bytes in total.

        Values are strings only: nested objects and arrays are rejected so the
        stored shape stays predictable.
      additionalProperties:
        type: string
        maxLength: 256
      example:
        agenda: sprint-review
        locale: pt-BR

    Call:
      type: object
      description: |
        One conversation held in a room.

        A call starts when it is created, which is why there is no separate
        `started_at`: `created_at` is when the conversation began, and two
        names for one instant would only invite them to disagree.

        Convia is authoritative for every field except `metadata` and
        `end_reason`, which belong to the application.
      required: [id, application_id, room_id, status, metadata, started_by, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/CallId"
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        room_id:
          $ref: "#/components/schemas/RoomId"
        status:
          $ref: "#/components/schemas/CallStatus"
        metadata:
          $ref: "#/components/schemas/CallMetadata"
        started_by:
          $ref: "#/components/schemas/CallActor"
        ended_by:
          allOf:
            - $ref: "#/components/schemas/CallActor"
          description: Who ended the call. Absent while it is still happening.
        end_reason:
          type: string
          description: |
            The explanation recorded with the ending, when one was given. Free
            text: the reasons a conversation ends are not Convia's to
            enumerate.
          minLength: 1
          maxLength: 200
        created_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: When the conversation began.
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        ended_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: When the conversation ended. Absent while it is still happening.

    CallPage:
      type: object
      description: One page of calls.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Call"
        next_cursor:
          type: string
          description: |
            Opaque token that continues the listing. Absent on the last page.
            Clients must never decode or construct one.

    StartCallRequest:
      type: object
      description: |
        The accepted body when starting a call. There is little to ask for,
        which is the point: a call takes its identity from the room it happens
        in and the moment it starts.
      additionalProperties: false
      properties:
        metadata:
          $ref: "#/components/schemas/CallMetadata"

    EndCallRequest:
      type: object
      description: |
        The accepted body when ending a call. The body itself is optional:
        ending a conversation is usually all a caller wants to say.
      additionalProperties: false
      properties:
        reason:
          type: string
          description: Why the conversation ended. Free text, and optional.
          minLength: 1
          maxLength: 200

    ParticipantId:
      type: string
      description: |
        Opaque identifier of a participation. Clients must treat it as opaque
        and must never parse it.
      pattern: "^part_[A-Z2-7]{26}$"
      example: part_7KQZP4XN2VJH6TBWMDR3YAFC5E

    ParticipantRole:
      type: string
      description: |
        What a participant may do in a call. A `moderator` may remove
        participants and change roles; a `member` may not.

        Roles about what a person may do with media — publish, subscribe, share
        a screen — are deliberately absent. They describe capabilities of a
        media plane that does not exist yet, so Convia could not enforce them,
        and a role that promises what nothing enforces is worse than no role.

        An omitted role on a join is `member`. Defaulting to the lesser of the
        two is the only safe direction: a mistyped field must never hand
        someone the authority to remove other people.
      enum: [moderator, member]

    ParticipantStatus:
      type: string
      description: |
        The lifecycle state of a participation. Three states, all reachable.

        `removed` is not a reason attached to `left`: it is terminal with a
        policy of its own, because someone a moderator put out must not simply
        rejoin. Attempting to do so answers `409 conflict`.
      enum: [joined, left, removed]

    ParticipantRemover:
      type: string
      description: |
        The authority behind a forced departure. `participant` names a
        moderator acting inside the call, and is accompanied by
        `removed_by_participant_id`. `application` and `operator` act from
        outside the conversation, so neither names a participant.
      enum: [application, operator, participant]

    InvitationId:
      type: string
      description: |
        Opaque identifier of an invitation. Clients must treat it as opaque and
        must never parse it.
      pattern: "^inv_[A-Z2-7]{26}$"
      example: inv_7KQZP4XN2VJH6TBWMDR3YAFC5E

    InvitationStatus:
      type: string
      description: |
        The state of an invitation.

        It is derived rather than stored. `expired` in particular is a fact
        about the clock rather than a row anybody had to write, so an
        invitation never reads as usable after it has stopped being usable.

        `redeemed` does not mean spent. An invitation that has been used still
        works until it expires or is withdrawn, which is what lets somebody
        whose connection dropped open the same link again.
      enum: [pending, redeemed, declined, revoked, expired]

    Invitation:
      type: object
      description: |
        Permission for one person to join one call.

        The person is named by their Convia user identifier and nothing else,
        for the same reason a roster names them that way: the application owns
        who they are.

        **No token appears here.** Convia stores only a digest and cannot show
        one again; the plaintext exists once, in the response that created it.
      required: [id, application_id, call_id, guest, role, status, expires_at, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/InvitationId"
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        call_id:
          $ref: "#/components/schemas/CallId"
        guest:
          type: boolean
          description: |
            Whether the invitation names nobody, so that whoever holds it joins
            as a guest.
        user_id:
          allOf:
            - $ref: "#/components/schemas/UserId"
          description: The person invited. Absent on a guest invitation.
        role:
          $ref: "#/components/schemas/ParticipantRole"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        expires_at:
          type: string
          format: date-time
          description: When the invitation stops being usable, as RFC 3339 in UTC.
        redeemed_at:
          type: string
          format: date-time
          description: When it was first redeemed. Absent until it has been.
        participant_id:
          $ref: "#/components/schemas/ParticipantId"
        declined_at:
          type: string
          format: date-time
          description: When the holder declined it. Absent unless they did.
        revoked_at:
          type: string
          format: date-time
          description: When the application withdrew it. Absent unless it did.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    IssuedInvitation:
      type: object
      description: |
        A newly created invitation together with the token its holder presents.

        This is the only response that ever contains one. Convia keeps a digest
        and nothing else, so a lost token cannot be recovered — issue another.
      required: [id, application_id, call_id, guest, role, status, expires_at, created_at, updated_at, token]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/InvitationId"
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        call_id:
          $ref: "#/components/schemas/CallId"
        guest:
          type: boolean
          description: |
            Whether the invitation names nobody, so that whoever holds it joins
            as a guest.
        user_id:
          allOf:
            - $ref: "#/components/schemas/UserId"
          description: The person invited. Absent on a guest invitation.
        role:
          $ref: "#/components/schemas/ParticipantRole"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        expires_at:
          type: string
          format: date-time
        redeemed_at:
          type: string
          format: date-time
        participant_id:
          $ref: "#/components/schemas/ParticipantId"
        declined_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        token:
          type: string
          description: |
            What the invitee presents to redeem or decline the invitation,
            as `Authorization: Bearer <token>`. Shown once and never again.
          example: cvi_7KQZP4XN2VJH6TBWMDR3YAFC5E_2QRSTUVWXYZ234567ABCDEFGHI

    InvitationPage:
      type: object
      description: One page of invitations, newest first.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        next_cursor:
          type: string
          description: |
            Opaque token for the next page. Absent on the last page.

    CreateInvitationRequest:
      type: object
      description: |
        What an application asks for when inviting someone.

        Name a `user_id`, or set `guest` to invite whoever holds the link.
        Exactly one of the two: naming nobody without asking for a guest is
        refused rather than treated as a guest invitation, because a request
        that forgot to name a person must not quietly become a way into the
        call for anyone.
      additionalProperties: false
      properties:
        user_id:
          allOf:
            - $ref: "#/components/schemas/UserId"
          description: |
            The person to invite. Omit it and set `guest` instead to invite
            somebody Convia has no user for.
        guest:
          type: boolean
          description: |
            Asks for an invitation that names nobody. Whoever redeems it takes
            part as a guest, and **Convia learns nothing about them**: their
            participation is identified by this invitation, and the
            application, which sent it, is the only party that knows who they
            are.
        role:
          allOf:
            - $ref: "#/components/schemas/ParticipantRole"
          description: |
            The role the invitation confers when redeemed. Omitted means
            `member`: a mistyped field must never hand somebody the authority
            to remove other people.
        expires_in_seconds:
          type: integer
          minimum: 1
          maximum: 2592000
          description: |
            How long the invitation lasts. Omitted means one day. A value
            beyond thirty days is refused rather than clamped, so an
            application never believes something untrue about its own links.

    Redemption:
      type: object
      description: |
        What the holder of an invitation receives when they redeem it: a place
        in the call and the means to connect to it.

        **No media provider appears here, and none ever will.** The connection
        fields are the same Convia-owned words the join session uses.
      required: [invitation_id, participant_id, call_id, role, media_url, media_token, expires_at]
      additionalProperties: false
      properties:
        invitation_id:
          $ref: "#/components/schemas/InvitationId"
        participant_id:
          $ref: "#/components/schemas/ParticipantId"
        call_id:
          $ref: "#/components/schemas/CallId"
        role:
          $ref: "#/components/schemas/ParticipantRole"
        media_url:
          type: string
          format: uri
          description: The address the client connects to.
          example: wss://media.convia.example
        media_token:
          type: string
          description: |
            The credential the client presents when connecting. It is
            short-lived and useless after `expires_at`; redeem again to get
            another.
        expires_at:
          type: string
          format: date-time
          description: |
            When the connection credential stops being accepted. This is the
            credential's expiry, not the invitation's.

    JoinSession:
      type: object
      description: |
        Connection instructions for one participant of one call.

        **No media provider appears here, and none ever will.** A client
        receives an address and a credential; it learns no room name, no
        permission grant, and nothing about which media infrastructure this
        deployment runs. Replacing that infrastructure is work inside Convia
        and does not change this response.

        Everything here is short-lived and single-purpose. The credential
        authorizes taking part in exactly this call, as exactly this
        participant, and carries no administrative power over the call: a
        moderator moderates through Convia's API, not through the media plane.
      required: [participant_id, call_id, media_url, media_token, expires_at]
      additionalProperties: false
      properties:
        participant_id:
          type: string
          description: |
            The participant these instructions belong to. It is also the
            identity this person appears under in the conversation, so other
            clients can match what they receive to Convia's roster.
          example: part_7KQZP4XN2VJH6TBWMDR3YAFC5E
        call_id:
          type: string
          description: The call being joined.
          example: call_7KQZP4XN2VJH6TBWMDR3YAFC5E
        media_url:
          type: string
          format: uri
          description: |
            The address the client connects to.

            It is a WebSocket address and is frequently not the address Convia
            itself uses, because a deployment commonly reaches its media
            infrastructure on a private network. Always use the value returned
            here rather than deriving one.
          example: wss://media.convia.example
        media_token:
          type: string
          description: |
            The credential the client presents when connecting.

            It is a bearer credential and should be treated like one: passed
            straight to the client that will use it, never logged, never
            stored, never shared between people. It is useless after
            `expires_at`.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.abbreviated.signature
        expires_at:
          type: string
          format: date-time
          description: |
            When the credential stops being accepted, as RFC 3339 in UTC.

            This bounds when a connection may be *opened*, not how long it may
            last. A connection already established is unaffected.
          example: "2026-09-09T19:45:00.000Z"

    Participant:
      type: object
      description: |
        One person's presence in one call.

        The person is named by their Convia user identifier and nothing else. A
        display name would copy into every roster entry something the
        application already owns and can change, and would put a person's name
        in a place nobody asked for it; a client that wants one reads the user.

        Someone joins when the record is created, which is why there is no
        separate `joined_at`: `created_at` is when they arrived.
      required: [id, application_id, call_id, guest, role, status, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/ParticipantId"
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        call_id:
          $ref: "#/components/schemas/CallId"
        guest:
          type: boolean
          description: |
            Whether this participation belongs to somebody Convia has no user
            for.

            It is published rather than left to be inferred from an absent
            `user_id`, so a client branches on a field that says what it means
            instead of on one that happens to be missing.
        user_id:
          allOf:
            - $ref: "#/components/schemas/UserId"
          description: |
            The person, when Convia knows them. Absent for a guest.
        invitation_id:
          allOf:
            - $ref: "#/components/schemas/InvitationId"
          description: |
            The invitation a guest redeemed, which is the only identity a guest
            has. Absent for a known user.

            **Convia holds nothing else about a guest** — no name, no address,
            no identity of any kind. The application sent the invitation, so
            the application is the party that knows who redeemed it.
        role:
          $ref: "#/components/schemas/ParticipantRole"
        status:
          $ref: "#/components/schemas/ParticipantStatus"
        removed_by:
          allOf:
            - $ref: "#/components/schemas/ParticipantRemover"
          description: Who removed the participant. Absent unless they were removed.
        removed_by_participant_id:
          allOf:
            - $ref: "#/components/schemas/ParticipantId"
          description: |
            The moderator who removed them, present only when `removed_by` is
            `participant`.
        removal_reason:
          type: string
          description: |
            The explanation recorded with the removal, when one was given. Free
            text: the reasons someone is put out of a conversation are not
            Convia's to enumerate.
          minLength: 1
          maxLength: 200
        created_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: When the person joined.
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        left_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: When the person left or was removed. Absent while present.

    ParticipantPage:
      type: object
      description: One page of participants.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
        next_cursor:
          type: string
          description: |
            Opaque token that continues the listing. Absent on the last page.
            Clients must never decode or construct one.

    JoinCallRequest:
      type: object
      description: |
        The accepted body when admitting someone to a call. The person is named
        rather than described: a participant is someone the application already
        told Convia about.
      required: [user_id]
      additionalProperties: false
      properties:
        user_id:
          $ref: "#/components/schemas/UserId"
        role:
          $ref: "#/components/schemas/ParticipantRole"

    RemoveParticipantRequest:
      type: object
      description: |
        The accepted body when putting someone out of a call. The body itself
        is optional: removing someone is usually all a caller wants to say.
      additionalProperties: false
      properties:
        by:
          allOf:
            - $ref: "#/components/schemas/ParticipantId"
          description: |
            The participant on whose authority the removal is made. Optional:
            without it the caller acts as itself. With it, Convia checks that
            participant is a moderator of the same call.

            An operator cannot use this field. An operator acts from outside
            the conversation, so there is no moderator to check or to credit.
        reason:
          type: string
          description: Why the person was removed. Free text, and optional.
          minLength: 1
          maxLength: 200

    ChangeParticipantRoleRequest:
      type: object
      description: |
        The accepted body when changing what a participant may do. The role
        must be stated: an omitted field would silently demote someone.
      required: [role]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/ParticipantRole"
        by:
          allOf:
            - $ref: "#/components/schemas/ParticipantId"
          description: |
            The participant on whose authority the change is made. Optional,
            and checked the same way as on a removal: promoting someone is
            exactly the authority the moderator role exists for.

    AccountId:
      type: string
      description: |
        Immutable public identifier of an account — a person who can sign in to
        Convia's own interface. It is the fingerprint of the account's public
        key: the first sixteen bytes of its SHA-256 digest, in base32. Clients
        store it as a reference.
      pattern: "^acc_[A-Z2-7]{26}$"
      example: acc_7KQZP4XN2VJH6TBWMDR3YAFC5E

    Username:
      type: string
      description: |
        What a person chose to be called, unique on this installation and fixed
        once chosen. Lowercase ASCII letters, digits, dots, dashes and
        underscores, beginning with a letter or a digit — a wider alphabet
        would let two names look identical while being different. Input is
        matched case-insensitively and stored lowercased.
      pattern: "^[a-z0-9][a-z0-9._-]{2,31}$"
      example: ana

    SignInRequest:
      type: object
      description: A username and a password.
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            The username the account was created with. Matching is
            case-insensitive.
          example: ana
        password:
          type: string
          minLength: 1
          maxLength: 256
          description: The password. Convia never logs it and never stores it.

    RegistrationRequest:
      type: object
      description: The username and password a person chooses for their account.
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          description: |
            The username to take. See `Username` for what is accepted; it is
            lowercased before it is stored.
          example: ana
        password:
          type: string
          minLength: 12
          maxLength: 256
          description: |
            At least twelve characters, and that is the only rule. It signs the
            person in and seals their key, so **it cannot be reset**.

    PasswordChangeRequest:
      type: object
      description: |
        The current password, and the one to replace it with.
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            Required. A session that was stolen must not be enough to lock the
            owner out of their own account.
        new_password:
          type: string
          minLength: 12
          maxLength: 256
          description: |
            At least twelve characters, and that is the only rule. Composition
            requirements — a capital, a digit, a symbol — make passwords more
            predictable rather than less, because people satisfy them in the
            same few ways.

    Me:
      type: object
      description: |
        The person a session belongs to.

        There is no session identifier here, no expiry, and no list of other
        sessions. A page does not need to know when its own credential lapses:
        it finds out by being refused, which is the only answer that cannot be
        stale.
      required: [account_id, user_id, username, handle]
      additionalProperties: false
      properties:
        account_id:
          $ref: "#/components/schemas/AccountId"
        user_id:
          allOf:
            - $ref: "#/components/schemas/UserId"
          description: |
            The Convia user representing this person in the first-party
            application. It is what every other endpoint addresses them by.
        username:
          $ref: "#/components/schemas/Username"
        handle:
          type: string
          description: |
            How this person is named to somebody else: the username, a `#`, the
            account identifier without its prefix, and one check character
            computed with the Luhn mod 32 algorithm, which catches a mistyped
            character before anything is sent.
          pattern: "^[a-z0-9][a-z0-9._-]{2,31}#[A-Z2-7]{27}$"
          example: ana#7KQZP4XN2VJH6TBWMDR3YAFC5EC

    PresenceState:
      type: string
      description: |
        What Convia will say about whether somebody is available.

        Three of these are asserted by an application and one is not: `offline`
        means nothing is being asserted at all, either because nothing ever was,
        because it was withdrawn, or because the last claim lapsed. It is
        therefore never sent *to* Convia — an application that means it deletes
        the presence instead.

        Listed strongest first, which is also the rule for aggregating a
        person's devices.
      enum:
        - busy
        - online
        - away
        - offline

    PresenceAssertion:
      type: object
      description: |
        What one device says about one person, and for how long.
      required: [state]
      additionalProperties: false
      properties:
        state:
          allOf:
            - $ref: "#/components/schemas/PresenceState"
          description: |
            What this device says. `offline` is refused: withdraw the presence
            instead, which is how a device says it is going away.
          example: online
        lifetime_seconds:
          type: integer
          minimum: 10
          maximum: 300
          default: 60
          description: |
            How long this claim stands without another heartbeat.

            The bounds are Convia's and are not negotiable: below the floor a
            claim would lapse inside the round trip meant to renew it, and above
            the ceiling it stops being presence and becomes a stale statement
            about a person. A value outside them is refused rather than clamped,
            so a caller is never left believing it got what it asked for.
          example: 60

    Presence:
      type: object
      description: |
        What Convia will say about one person.

        There is no device list and no device count. The question presence
        answers is whether somebody is available; how many screens they have
        open is a detail about their day, and a colleague reading a roster has
        no business learning it.
      required: [user_id, state]
      additionalProperties: false
      properties:
        user_id:
          $ref: "#/components/schemas/UserId"
        state:
          $ref: "#/components/schemas/PresenceState"
        since:
          type: string
          format: date-time
          description: |
            When the person entered this state, taken from the earliest device
            still asserting it rather than from the most recent heartbeat — so a
            client showing "away for 20 minutes" does not see it reset every
            time a heartbeat arrives.

            Absent when the person is offline: nobody is saying anything, and
            Convia deliberately does not remember when they stopped.
          example: "2026-09-10T14:00:00.000Z"
        expires_at:
          type: string
          format: date-time
          description: |
            When this would lapse if no further heartbeat arrived. Absent when
            the person is offline, because nothing is pending.
          example: "2026-09-10T14:01:00.000Z"

    PresenceList:
      type: object
      description: |
        Presence for each user asked about, in the order asked.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Presence"

    Scope:
      type: string
      description: |
        One permission a credential may carry. Scopes name Convia domain
        operations rather than HTTP routes, so a permission keeps its meaning
        when a route is added, renamed, or split.
      enum:
        - users:read
        - users:write
        - credentials:read
        - credentials:write
        - rooms:read
        - rooms:write
        - calls:read
        - calls:write
        - participants:read
        - participants:write
        - invitations:read
        - invitations:write
        - events:read
        - webhooks:read
        - webhooks:write
        - presence:read
        - presence:write
        - messages:read
        - messages:write
        - members:read
        - members:write

    OwnMessageRequest:
      type: object
      description: |
        Something the signed-in person is saying, or the replacement for it.

        It carries no author. That is the whole difference from `MessageRequest`, which an application sends: the application names which of its people is speaking, and a person cannot name anybody, because naming somebody would mean naming somebody else.
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
          description: What was said, stored without interpretation.
          minLength: 1
          maxLength: 4000
          example: On my way.

    OwnReadStateRequest:
      type: object
      description: How far the signed-in person has read. It names nobody.
      required: [sequence]
      additionalProperties: false
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
          description: The furthest message read, by its `sequence`.
          example: 42

    RoomInvitationId:
      type: string
      description: Opaque identifier of an invitation into a room.
      pattern: "^rin_[A-Z2-7]{26}$"
      example: rin_7KQZP4XN2VJH6TBWMDR3YAFC5E

    RemoteRoomId:
      type: string
      description: Opaque identifier of a person's pointer to a room on another installation.
      pattern: "^rrm_[A-Z2-7]{26}$"
      example: rrm_7KQZP4XN2VJH6TBWMDR3YAFC5E

    Handle:
      type: string
      description: |
        How a person is named to somebody else: the username, a `#`, the account identifier without its prefix, and one Luhn mod 32 check character. Input is forgiving about case, surrounding spaces, and dashes or spaces inside the identifier; a check character that does not match is refused.
      example: bia#7QK4XMZP2VJH6TBWNDR3YAFC5EH

    RoomInvitationRequest:
      type: object
      description: Who to invite, by handle.
      required: [handle]
      additionalProperties: false
      properties:
        handle:
          $ref: "#/components/schemas/Handle"

    RoomInvitation:
      type: object
      description: |
        An invitation, and the link to send.

        The link names this installation by the address the request came from. It carries nothing that grants access, so it can be sent through any channel.
      required: [id, link, invitee, expires_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/RoomInvitationId"
        link:
          type: string
          format: uri
          example: https://convia.example/invitations/rin_7KQZP4XN2VJH6TBWMDR3YAFC5E
        invitee:
          $ref: "#/components/schemas/Handle"
        expires_at:
          type: string
          format: date-time

    InvitationLinkRequest:
      type: object
      description: An invitation link somebody was sent.
      required: [link]
      additionalProperties: false
      properties:
        link:
          type: string
          maxLength: 400
          example: https://convia.example/invitations/rin_7KQZP4XN2VJH6TBWMDR3YAFC5E

    InvitationLook:
      type: object
      description: What an invitation link is for, as its home describes it to the person it names.
      required: [home, room_name, inviter, invitee, expires_at]
      additionalProperties: false
      properties:
        home:
          type: string
          description: The scheme and authority of the installation the room lives on.
          example: https://convia.example
        room_name:
          type: string
          example: Standup
        inviter:
          type: string
          description: Who sent the invitation, by handle where they have one.
          example: ana#7KQZP4XN2VJH6TBWMDR3YAFC5EC
        invitee:
          $ref: "#/components/schemas/Handle"
        expires_at:
          type: string
          format: date-time

    RemoteRoom:
      type: object
      description: |
        A room this person belongs to on another installation. A pointer and a label: nothing said in it is kept here.
      required: [id, home, room_id, user_id, name]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/RemoteRoomId"
        home:
          type: string
          example: https://convia.example
        room_id:
          $ref: "#/components/schemas/RoomId"
        user_id:
          allOf:
            - $ref: "#/components/schemas/UserId"
          description: Who this person is at the home, so their own messages can be told apart.
        name:
          type: string
          example: Standup

    RemoteRoomPage:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RemoteRoom"

    JoinedRoom:
      type: object
      description: |
        The room an accepted link joined. `remote_room` is present when the room lives on another installation; when it lives here, the person is simply a member of it and it appears among their own rooms.
      required: [room_id, room_name]
      additionalProperties: false
      properties:
        room_id:
          $ref: "#/components/schemas/RoomId"
        room_name:
          type: string
        remote_room:
          $ref: "#/components/schemas/RemoteRoom"

    PeerInvitation:
      type: object
      description: An invitation, described by its home to the installation of the person it names.
      required: [room_name, inviter, invitee, expires_at]
      additionalProperties: false
      properties:
        room_name:
          type: string
        inviter:
          type: string
        invitee:
          $ref: "#/components/schemas/Handle"
        expires_at:
          type: string
          format: date-time

    PeerAcceptRequest:
      type: object
      description: The username of the person accepting. It must be the one the invitation named.
      required: [username]
      additionalProperties: false
      properties:
        username:
          type: string
          maxLength: 32
          example: bia

    PeerAccepted:
      type: object
      description: The room the person joined at its home, and who they are there.
      required: [room_id, room_name, user_id, local]
      additionalProperties: false
      properties:
        room_id:
          $ref: "#/components/schemas/RoomId"
        room_name:
          type: string
        user_id:
          $ref: "#/components/schemas/UserId"
        local:
          type: boolean
          description: True when the person signs in at the home itself, so no pointer is needed.

    SidebarRoom:
      type: object
      description: |
        One room in somebody's sidebar, with what they have not read in it.

        The unread count travels with the room rather than being fetched separately, because a sidebar is redrawn constantly and a request per row on the screen is the shape that makes an interface feel slow.
      required: [id, name, status, unread]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/RoomId"
        alias:
          type: string
          description: The stable name the application chose, absent for an anonymous room.
          example: weekly-standup
        name:
          type: string
          description: The label a person reads.
          example: Weekly Standup
        status:
          $ref: "#/components/schemas/RoomStatus"
        unread:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many messages this person has not read. Excludes their own messages and withdrawn ones.
          example: 3

    Sidebar:
      type: object
      description: One page of the rooms somebody is in.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SidebarRoom"
        next_cursor:
          type: string
          description: The room identifier to continue from, absent at the end of the listing.
          example: room_7KQZP4XN2VJH6TBWMDR3YAFC5E

    RoomMember:
      type: object
      description: |
        One person's place in one room.

        It carries no display name, for the reason a call roster does not:
        copying one here would put a person's name where nobody asked for it,
        and would duplicate something the application owns and can change.
      required: [application_id, room_id, user_id, created_at]
      additionalProperties: false
      properties:
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        room_id:
          $ref: "#/components/schemas/RoomId"
        user_id:
          $ref: "#/components/schemas/UserId"
        created_at:
          type: string
          format: date-time
          description: When they were given the place.
          example: "2026-09-12T09:14:02.114523Z"

    RoomMemberPage:
      type: object
      description: One page of places, in a room or of a person.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RoomMember"
        next_cursor:
          type: string
          description: |
            The identifier to continue from, absent at the end of the listing.
          example: usr_7QK4XMZP2VJH6TBWNDR3YAFC5E

    OwnRoomRequest:
      type: object
      description: |
        The accepted body when a person opens a room.

        It carries a name and nothing else. An alias is the application's own namespace, metadata is the application's own data, and a capacity is a policy: a person setting any of them would be deciding something on the application's behalf.
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Weekend plans

    OwnRoom:
      type: object
      description: A room as the person who opened it sees it.
      required: [id, name, status, created_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/RoomId"
        name:
          type: string
          example: Weekend plans
        status:
          $ref: "#/components/schemas/RoomStatus"
        created_at:
          type: string
          format: date-time
          example: "2026-09-13T10:02:41.004812Z"

    Person:
      type: object
      description: |
        Somebody a signed-in person can see, by the name they go by.

        Unlike `RoomMember`, this carries a display name. An application owns its people's names and reads them itself; a person has no other way to learn what to call somebody, and everybody this describes is somebody they already share a room with.
      required: [user_id, display_name]
      additionalProperties: false
      properties:
        user_id:
          $ref: "#/components/schemas/UserId"
        display_name:
          type: string
          description: The name the application gave this person. It may be empty.
          example: Ana Ribeiro

    PersonPage:
      type: object
      description: One page of people.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        next_cursor:
          type: string
          description: The identifier to continue from, absent at the end of the listing.
          example: usr_7QK4XMZP2VJH6TBWNDR3YAFC5E

    MessageId:
      type: string
      description: Opaque, immutable public identifier of a message.
      pattern: "^msg_[A-Z2-7]{26}$"
      example: msg_6TBWNDR3YAFC5E7QK4XMZP2VJH

    MessageAuthor:
      type: object
      description: |
        Which person is speaking, editing, or withdrawing.

        Exactly one of the two is required. `user_id` names one of the
        application's people; `invitation_id` names a guest, who has no Convia
        user and about whom Convia learns nothing else — the application knows
        who it sent the invitation to.

        This is the same shape a participant takes on a roster, deliberately.
        It is the same question about the same people, and answering it two
        ways is how a roster and a history would come to disagree about who was
        in the room.
      properties:
        user_id:
          $ref: "#/components/schemas/UserId"
        invitation_id:
          $ref: "#/components/schemas/InvitationId"
      additionalProperties: false

    MessageRequest:
      type: object
      description: |
        Something somebody said, or the replacement for it.

        Posting and editing take the same shape because they are the same
        statement: this person, these words.
      required: [body]
      properties:
        user_id:
          $ref: "#/components/schemas/UserId"
        invitation_id:
          $ref: "#/components/schemas/InvitationId"
        body:
          type: string
          description: |
            What was said, stored without interpretation.

            Surrounding whitespace is trimmed, and a message that is only
            whitespace is refused as empty. Line breaks and tabs are allowed —
            this is the one field in Convia where a control character is, since
            every other caller-supplied text is a label — and every other
            control character is refused.

            The bound is a storage bound rather than a product opinion.
            Messages are the most abundant row Convia holds, and a field with
            no ceiling is one an application can turn into a blob store.
          minLength: 1
          maxLength: 4000
          example: Standup in five minutes.
      additionalProperties: false

    Message:
      type: object
      description: One thing somebody said in a room.
      required: [id, application_id, room_id, sequence, deleted, created_at]
      properties:
        id:
          $ref: "#/components/schemas/MessageId"
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        room_id:
          $ref: "#/components/schemas/RoomId"
        sequence:
          type: integer
          format: int64
          minimum: 1
          description: |
            The message's position in its room's history, and the only ordering
            a client should use.

            **Not a timestamp, and this is the point.** A deployment is several
            instances, each stamping `created_at` from its own clock, so two
            messages written milliseconds apart on different machines can carry
            timestamps in the wrong order. The sequence is allocated by Convia
            under the room's lock, which makes it the one answer two instances
            cannot disagree about.

            What may be assumed: it is **strictly increasing within a room**, so
            a higher sequence was said later; it is **per room**, and every room
            counts from 1; and it is **not dense**. Gaps are permitted, because
            erasing a message for real rather than withdrawing it leaves one.
          example: 42
        user_id:
          $ref: "#/components/schemas/UserId"
        invitation_id:
          $ref: "#/components/schemas/InvitationId"
        body:
          type: string
          description: |
            What was said.

            **Absent once the message is withdrawn.** A tombstone carrying an
            empty string would be indistinguishable from a bug, so the field is
            omitted and `deleted` says why.
          maxLength: 4000
          example: Standup in five minutes.
        deleted:
          type: boolean
          description: |
            Whether the message was withdrawn.

            A withdrawn message keeps its row and its position and loses its
            body. The history does not close over the hole, because doing so
            would move every later message and slide some past a client's
            cursor unseen.
          example: false
        created_at:
          type: string
          format: date-time
          description: |
            When the instance that handled the request recorded the message.

            It is a report, not an ordering. Use `sequence` to order a room.
          example: "2026-09-11T14:02:31.114523Z"
        edited_at:
          type: string
          format: date-time
          description: |
            When the body was last replaced, absent if it never was.

            Convia records **that** a message was edited and not what it said
            before. Keeping the previous text would double the storage of the
            most abundant row in the system and create a second copy to find
            when somebody asks to be erased.
          example: "2026-09-11T14:05:02.887301Z"
        deleted_at:
          type: string
          format: date-time
          description: When the message was withdrawn, absent if it was not.
          example: "2026-09-11T14:09:44.201118Z"

    ReadStateRequest:
      type: object
      description: How far somebody has read.
      required: [user_id, sequence]
      additionalProperties: false
      properties:
        user_id:
          $ref: "#/components/schemas/UserId"
        sequence:
          type: integer
          format: int64
          minimum: 1
          description: |
            The furthest message read, by its `sequence`. A position beyond
            the room's newest message is refused.
          example: 42

    ReadState:
      type: object
      description: |
        How far one person has read in one room, and how much they have not.
      required: [room_id, user_id, sequence, unread]
      additionalProperties: false
      properties:
        room_id:
          $ref: "#/components/schemas/RoomId"
        user_id:
          $ref: "#/components/schemas/UserId"
        sequence:
          type: integer
          format: int64
          minimum: 0
          description: |
            The furthest message this person has read.

            `0` means they have read nothing: sequences count from one, so it
            is a position nothing occupies, which is what a room somebody has
            never opened needs to say.
          example: 42
        unread:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many messages after `sequence` they have not read.

            Derived on every read rather than stored, so it cannot drift from
            the history. It excludes their own messages and withdrawn ones.
          example: 3
        updated_at:
          type: string
          format: date-time
          description: |
            When the position last moved forward, absent for somebody who has
            read nothing.
          example: "2026-09-11T14:11:02.004512Z"

    MessagePage:
      type: object
      description: One window of a room's history.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          type: string
          description: |
            The `sequence` to continue from, absent when the window reached the
            end of the history in the direction it was reading.
          example: "17"

    WebhookEndpointId:
      type: string
      description: Opaque, immutable public identifier of a webhook endpoint.
      pattern: "^whk_[A-Z2-7]{26}$"
      example: whk_4XZQP7KN2VJH6TBWMDR3YAFC5E

    WebhookDeliveryId:
      type: string
      description: |
        Opaque, immutable public identifier of one delivery. It travels in the
        `Convia-Delivery` header, and it is what a consumer records to
        recognize a delivery it has already handled.
      pattern: "^whd_[A-Z2-7]{26}$"
      example: whd_7KQZP4XN2VJH6TBWMDR3YAFC5E

    WebhookEndpointStatus:
      type: string
      description: |
        Whether Convia is delivering to this endpoint. An endpoint is disabled
        by the application, or by Convia after repeated failures, and a
        disabled one always says why.
      enum: [enabled, disabled]

    WebhookDeliveryStatus:
      type: string
      description: |
        Where one delivery got to. `pending` is the only state with work left
        in it; the other two are final.
      enum: [pending, delivered, failed]

    WebhookEndpoint:
      type: object
      description: |
        One destination Convia delivers events to.

        The signing secret is never here. It is returned once when the endpoint
        is registered and once more whenever it is rotated, and no read
        includes it.
      required: [id, application_id, name, url, event_types, status,
                 consecutive_failures, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/WebhookEndpointId"
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        name:
          type: string
          description: The application's own label for this destination.
          maxLength: 120
        url:
          type: string
          format: uri
          description: |
            Where deliveries are sent. `https` outside development, and never
            an address that is not on the public internet.
          maxLength: 2000
        event_types:
          type: array
          description: The event types this endpoint asked about.
          minItems: 1
          items:
            $ref: "#/components/schemas/EventType"
        status:
          $ref: "#/components/schemas/WebhookEndpointStatus"
        consecutive_failures:
          type: integer
          description: |
            How many deliveries in a row Convia has given up on. It resets on
            any success, so a growing number is a destination that has stopped
            working rather than one having a bad afternoon.
        disabled_reason:
          type: string
          description: |
            Why Convia stopped delivering, in Convia's own words. Present
            exactly when the endpoint is disabled.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RegisteredWebhookEndpoint:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          description: |
            The endpoint together with its signing secret, which is returned by
            registering and by rotating and by nothing else.
          required: [secret]
          properties:
            secret:
              type: string
              description: |
                The key deliveries to this endpoint are signed with. **Store it
                now**: no read returns it, and the only way to get another is
                to rotate, which invalidates this one.
              example: whsec_4XZQP7KN2VJH6TBWMDR3YAFC5E

    RegisterWebhookRequest:
      type: object
      description: |
        What an application asks for when it wants to be told things.

        There is no secret here. The signing key is Convia's to generate,
        because a key an application chose is one it may have reused from
        somewhere else.
      required: [name, url, event_types]
      additionalProperties: false
      properties:
        name:
          type: string
          description: A label for this destination, for whoever reads the list later.
          maxLength: 120
        url:
          type: string
          format: uri
          description: |
            Where to deliver. Checked when this is called and again before
            every attempt, because what a hostname resolves to can change.
          maxLength: 2000
        event_types:
          type: array
          description: |
            Which events to be told about. At least one, and every one of them
            a type Convia delivers — an unknown type is refused rather than
            registered as a subscription that could never fire.
          minItems: 1
          items:
            $ref: "#/components/schemas/EventType"

    WebhookEndpointPage:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpoint"
        next_cursor:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.

    WebhookDelivery:
      type: object
      description: |
        One event owed to one endpoint, and what happened to it.

        The body that was sent is not published here. It is the event, and
        keeping a copy of it on every delivery would put the same content in a
        second place with a different lifetime.
      required: [id, endpoint_id, application_id, event_id, event_type,
                 status, attempts, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/WebhookDeliveryId"
        endpoint_id:
          $ref: "#/components/schemas/WebhookEndpointId"
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        event_id:
          $ref: "#/components/schemas/EventId"
        event_type:
          $ref: "#/components/schemas/EventType"
        status:
          $ref: "#/components/schemas/WebhookDeliveryStatus"
        attempts:
          type: integer
          description: How many times Convia has tried.
        next_attempt_at:
          type: string
          format: date-time
          description: When Convia will try again. Present only while pending.
        last_status_code:
          type: integer
          description: |
            What the destination answered on the last attempt. Absent when the
            attempt produced no response at all, which is a different failure
            from one that answered.
        last_error:
          type: string
          description: |
            Convia's own description of the last failure. Never the body the
            destination returned, which is text Convia did not write.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time
          description: When a destination accepted it. Present only once delivered.

    WebhookDeliveryPage:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        next_cursor:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.

    EventId:
      type: string
      description: |
        Opaque, immutable public identifier for one event. It is not secret and
        is safe to log: matching it against a `correlation_id` is how a
        delivered event is tied to the request that caused it.
      pattern: "^evt_[A-Z2-7]{26}$"
      example: evt_2QF7XKN4VJH6TBWMDR3YAC5EZP

    EventType:
      type: string
      description: |
        What happened. The vocabulary is closed and additive: a new type may
        appear, and an existing one never changes meaning, so a client must
        ignore a type it does not recognize rather than treat it as an error.
      enum:
        - call.started
        - call.ended
        - participant.joined
        - participant.left
        - participant.removed
        - participant.role_changed
        - invitation.declined
        - message.posted
        - message.edited
        - message.deleted
        - room.member_added
        - room.member_removed
        - presence.changed

    EventSubjectType:
      type: string
      description: |
        What kind of thing the event is about, so that `subject.id` is never
        ambiguous about what it addresses.
      enum:
        - call
        - participant
        - invitation
        - user
        - message
        - room

    EventSubject:
      type: object
      description: The thing an event is about.
      required: [type, id]
      additionalProperties: false
      properties:
        type:
          $ref: "#/components/schemas/EventSubjectType"
        id:
          type: string
          description: |
            The subject's public identifier, of the kind `type` names.
          example: part_4XZQP7KN2VJH6TBWMDR3YAFC5E

    Event:
      type: object
      description: |
        One thing that happened, in the shape it is delivered in over the
        stream opened by `GET /v1/events`.

        Everything an event carries is a value Convia assigned: identifiers,
        states, roles, flags. Application-composed text stays out — a removal
        reason, an end reason, and call metadata may all describe a person, and
        a live stream is the last place to widen that. A client that wants them
        reads the resource.
      required: [id, version, type, occurred_at, application_id, subject]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/EventId"
        version:
          type: integer
          description: |
            The envelope version, carried on every event rather than negotiated
            once per connection, so that an event forwarded somewhere else
            stays interpretable away from the stream it arrived on.
          example: 1
        type:
          $ref: "#/components/schemas/EventType"
        occurred_at:
          type: string
          format: date-time
          description: When Convia recorded what happened, in UTC.
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        subject:
          $ref: "#/components/schemas/EventSubject"
        correlation_id:
          type: string
          description: |
            The request that caused the event, matching the `X-Request-ID` of
            that request and the audit entry for the same occurrence. Absent
            when the cause was not a request.
        data:
          $ref: "#/components/schemas/EventData"

    EventData:
      type: object
      description: |
        What the event says beyond naming its subject.

        The keys depend on the type. Call events carry `room_id`, `status`, and
        `actor`. Participant events carry `call_id`, `role`, `status`, `guest`,
        and whichever of `user_id` or `invitation_id` identifies the person,
        plus `removed_by` and `removed_by_participant_id` on a removal.
        Invitation events carry `call_id`, `role`, `guest`, `status`, and
        `user_id` when the invitation names somebody. Message events carry
        `room_id`, `sequence`, `guest`, `deleted`, `edited`, and whichever of
        `user_id` or `invitation_id` wrote the message. Membership events are
        about the room and carry `user_id`, the person whose place changed.

        New keys may be added, so a client must ignore ones it does not know.
      additionalProperties: true

    CredentialId:
      type: string
      description: |
        Opaque, immutable public identifier. It is not secret: it travels
        inside the key and appears in listings and audit records.
      pattern: "^cred_[A-Z2-7]{26}$"
      example: cred_4XZQP7KN2VJH6TBWMDR3YAFC5E

    UpdateUserRequest:
      type: object
      description: |
        The accepted body when changing the attributes an application owns.

        Only the fields present in the body change; an omitted field keeps its
        stored value. Sending `display_name` as an empty string clears it, and
        `metadata` is replaced wholesale rather than merged, so a key is removed
        by sending the object without it.

        At least one field must be present.
      minProperties: 1
      additionalProperties: false
      properties:
        display_name:
          type: string
          description: Optional display name, owned by the application.
          maxLength: 120
        metadata:
          $ref: "#/components/schemas/UserMetadata"

    UserMetadata:
      type: object
      description: |
        Application-owned key-value data that Convia stores without
        interpreting. At most 16 entries, keys of at most 40 characters made of
        lowercase letters, digits, and underscores and starting with a letter,
        values of at most 256 characters, and at most 4096 bytes in total.

        Values are strings only: nested objects and arrays are rejected so the
        stored shape stays predictable. An application that wants an avatar
        stores its URL here.
      additionalProperties:
        type: string
        maxLength: 256
      example:
        plan: pro
        avatar_url: https://example.test/avatars/42.png

    UserId:
      type: string
      description: |
        Opaque, immutable public identifier. Clients store it as a reference and
        must never parse it.
      pattern: "^usr_[A-Z2-7]{26}$"
      example: usr_7KQZP4XN2VJH6TBWMDR3YAFC5E

    Application:
      type: object
      description: A Convia tenant.
      required: [id, name, status, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/ApplicationId"
        name:
          type: string
          description: Display name. It carries no security meaning.
          minLength: 1
          maxLength: 120
          example: Workspace Town
        status:
          type: string
          description: |
            Lifecycle state. `active` is served normally, `suspended` retains
            data while refusing new work, and `deleted` is gone from the API.
          enum: [active, suspended, deleted]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    ApplicationPage:
      type: object
      description: One page of applications.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        next_cursor:
          type: string
          description: |
            Opaque token that returns the next page. Absent on the last page.
            Clients must not decode or construct it.

    RenameApplicationRequest:
      type: object
      description: The accepted body when renaming an application.
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: |
            New display name. Surrounding whitespace is insignificant, and
            control characters are rejected.
          minLength: 1
          maxLength: 120

    CreateApplicationRequest:
      type: object
      description: The accepted body when creating an application.
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: |
            Display name. Surrounding whitespace is insignificant, and control
            characters are rejected.
          minLength: 1
          maxLength: 120

    ApplicationId:
      type: string
      description: |
        Opaque, immutable public identifier. Clients store it as a reference and
        must never parse it.
      pattern: "^app_[A-Z2-7]{26}$"
      example: app_MXHJAY4MJNX2FO22XWJ3XNCKHT

    Timestamp:
      type: string
      format: date-time
      description: UTC RFC 3339 timestamp with millisecond precision.
      example: "2026-09-05T14:04:56.154Z"

    Readiness:
      type: object
      description: Readiness of Convia and of each dependency it requires.
      required: [status, checks]
      additionalProperties: false
      properties:
        status:
          type: string
          description: Aggregate readiness. `ready` only when every check passes.
          enum: [ready, unavailable]
        checks:
          type: object
          description: Result of each dependency check, keyed by dependency name.
          additionalProperties:
            type: string
            enum: [ok, unavailable]

    Health:
      type: object
      description: Health of the Convia process.
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          description: Always `ok` when the process can serve requests.
          enum: [ok]

    ErrorCode:
      type: string
      description: |
        Stable, machine-readable identifier of a failure. Clients branch on this
        value rather than on the human-readable message. Adding a code is an
        additive change; changing the meaning of an existing code is breaking.
      enum:
        - invalid_request
        - malformed_json
        - unsupported_media_type
        - payload_too_large
        - unauthenticated
        - forbidden
        - not_found
        - method_not_allowed
        - precondition_failed
        - conflict
        - rate_limited
        - internal_error
        - unavailable

    Error:
      type: object
      description: |
        The single error representation used by every Convia failure, including
        failures produced by routing and middleware.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: |
                Human-readable description for developers. It may change at any
                time and must never be parsed or matched by clients.
            request_id:
              type: string
              description: |
                Correlation identifier of the failed request, matching the
                `X-Request-ID` response header. Quote it in support requests.

  parameters:
    ApplicationID:
      name: application_id
      in: path
      required: true
      description: Identifier of the application.
      schema:
        $ref: "#/components/schemas/ApplicationId"

    InvitationID:
      name: invitation_id
      in: path
      required: true
      description: Opaque identifier of an invitation.
      schema:
        $ref: "#/components/schemas/InvitationId"

    WebhookEndpointID:
      name: endpoint_id
      in: path
      required: true
      description: Opaque identifier of a webhook endpoint.
      schema:
        $ref: "#/components/schemas/WebhookEndpointId"

    WebhookDeliveryID:
      name: delivery_id
      in: path
      required: true
      description: Opaque identifier of a webhook delivery.
      schema:
        $ref: "#/components/schemas/WebhookDeliveryId"

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A client-generated key that makes a retry safe.

        A client that receives no response cannot tell whether its request was
        lost on the way out or on the way back. Presenting a key means the
        operation is performed at most once: a repeat of the same request
        returns the original response, including its original status.

        - The key is opaque to Convia and at most 255 characters.
        - A repeat of the same request replays the original response.
        - A repeat carrying a different body is refused with `409 conflict`.
        - A repeat arriving while the first is still running is refused with
          `409 conflict`, and succeeds once the first has finished.
        - Keys are remembered for at least 24 hours. Past that window, the same
          key is treated as a new request.
        - Keys belong to the caller that presented them, so two callers using
          the same value never meet.

        A response the server may give differently on the next attempt -- an
        internal error, or a rate-limited refusal -- is not stored, so a retry
        after one is a real attempt rather than a replayed failure.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 6f1a7b3e-2c4d-4e8a-9f01-2b3c4d5e6f70

    UserID:
      name: user_id
      in: path
      required: true
      description: Identifier of the user, within the application in the path.
      schema:
        $ref: "#/components/schemas/UserId"

    DeviceID:
      name: device_id
      in: path
      required: true
      description: |
        The application's own opaque identifier for one device.

        Convia never interprets it. Use a value generated per installation
        rather than anything describing the device: Convia stores what it
        receives, and a model name is a detail about a person that presence does
        not need.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9._-]+$"
      example: dv-8f2c41

    CredentialID:
      name: credential_id
      in: path
      required: true
      description: The credential's opaque identifier.
      schema:
        $ref: "#/components/schemas/CredentialId"

    OperatorCredentialID:
      name: credential_id
      in: path
      required: true
      description: The operator credential's opaque identifier.
      schema:
        $ref: "#/components/schemas/OperatorCredentialId"

    MessageID:
      name: message_id
      in: path
      required: true
      description: The message's opaque identifier.
      schema:
        $ref: "#/components/schemas/MessageId"

    ReaderID:
      name: user_id
      in: query
      required: true
      description: |
        Whose read state to report. Required: there is no sensible default,
        since the credential names an application rather than a person.
      schema:
        $ref: "#/components/schemas/UserId"

    MembershipCursor:
      name: cursor
      in: query
      required: false
      description: |
        The identifier to continue a membership listing from, exclusive.

        Membership listings are ordered by the column their index already
        holds — the person for a room's members, the room for somebody's rooms
        — so the cursor is the last identifier on the previous page rather than
        an encoded pair. There is nothing else for it to carry.
      schema:
        type: string
      example: usr_7QK4XMZP2VJH6TBWNDR3YAFC5E

    MessageCursor:
      name: cursor
      in: query
      required: false
      description: |
        The `sequence` to read a room's history from, exclusive.

        Unlike the opaque cursor a room listing returns, this is a plain
        number, because it is one a client already holds: every message
        publishes its sequence, and read state is expressed in the same value.
        Encoding it would hide something the client needs anyway.

        Omitting it starts from the end the direction begins at: the newest
        message for `older`, the very beginning for `newer`.
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 41

    HistoryDirection:
      name: direction
      in: query
      required: false
      description: |
        Which way through the history to read.

        `older` pages backwards from the newest, which is what opening a room
        does. `newer` pages forwards from a position, which is what catching up
        after being away does.
      schema:
        type: string
        enum: [older, newer]
        default: older

    RoomInvitationID:
      name: invitation_id
      in: path
      required: true
      description: The room invitation's opaque identifier.
      schema:
        $ref: "#/components/schemas/RoomInvitationId"

    RemoteRoomID:
      name: remote_room_id
      in: path
      required: true
      description: The identifier of this person's pointer to a room on another installation.
      schema:
        $ref: "#/components/schemas/RemoteRoomId"

    RoomID:
      name: room_id
      in: path
      required: true
      description: The room's opaque identifier.
      schema:
        $ref: "#/components/schemas/RoomId"

    RoomStatusFilter:
      name: status
      in: query
      required: false
      description: |
        Return only rooms in this lifecycle state. Without it, deleted rooms are
        excluded and everything else is returned.
      schema:
        $ref: "#/components/schemas/RoomStatus"

    RoomAliasFilter:
      name: alias
      in: query
      required: false
      description: |
        Return the single room holding this alias instead of a page. The result
        is still delivered in the `data` array, so one response shape serves
        both forms of the request.
      schema:
        $ref: "#/components/schemas/RoomAlias"

    CallID:
      name: call_id
      in: path
      required: true
      description: The call's opaque identifier.
      schema:
        $ref: "#/components/schemas/CallId"

    CallStatusFilter:
      name: status
      in: query
      required: false
      description: |
        Return only calls in this lifecycle state. Without it every call is
        returned, because a call history is what the listing is for.

        Filtering by `active` is how a caller asks what is happening in a room
        right now, and answers with at most one call.
      schema:
        $ref: "#/components/schemas/CallStatus"

    ParticipantID:
      name: participant_id
      in: path
      required: true
      description: The participation's opaque identifier.
      schema:
        $ref: "#/components/schemas/ParticipantId"

    ParticipantStatusFilter:
      name: status
      in: query
      required: false
      description: |
        Return only participants in this state. Without it everyone is
        returned, including those who left, because a roster is also a record
        of who was there.

        Filtering by `joined` answers who is present now.
      schema:
        $ref: "#/components/schemas/ParticipantStatus"

    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Entity tag from a previous read. When present, the update applies only
        while the resource still carries that version. Only a strong validator
        is honored; `*` and weak validators are treated as no condition.
      schema:
        type: string
      example: '"9f2c1d4b8a3e5f60"'

    Limit:
      name: limit
      in: query
      required: false
      description: |
        Maximum number of items to return in one page. Values above the maximum
        are rejected with `invalid_request` rather than silently clamped.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 25

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque continuation token returned by a previous page. Clients must not
        construct, decode, or persist cursors beyond the paging sequence.
      schema:
        type: string
        maxLength: 512

  headers:
    SessionCookie:
      description: |
        The session, as a cookie.

        `__Host-convia_session`, with `HttpOnly`, `Secure`, `SameSite=Lax`,
        `Path=/`, and no `Domain`. The `__Host-` prefix is enforced by the
        browser rather than by Convia: only the exact host that set it can set
        it, so a compromised sibling subdomain cannot overwrite or shadow it.

        `Max-Age` carries the idle window rather than the absolute one, so a
        browser stops sending a cookie that stopped working.
      schema:
        type: string
      example: __Host-convia_session=cvs_...; Path=/; Max-Age=1209600; HttpOnly; Secure; SameSite=Lax

    ClearedSessionCookie:
      description: |
        The same cookie, expired. Every attribute matches the one that set it,
        because a browser matches a replacement by name, path, and domain.

        Clearing it is the lesser half of signing out; revoking the session is
        the half that counts.
      schema:
        type: string
      example: __Host-convia_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax

    RequestId:
      description: |
        Correlation identifier of the request. Convia echoes a safe
        client-supplied `X-Request-ID` and otherwise generates one.
      required: true
      schema:
        type: string
        maxLength: 128

    Allow:
      description: Methods supported by the requested resource.
      required: true
      schema:
        type: string

    ETag:
      description: |
        Opaque version of the returned resource. Send it back as `If-Match` to
        make a later update conditional. Clients compare it, never parse it.
      required: true
      schema:
        type: string

    Deprecation:
      description: |
        Present when the operation is deprecated. Carries the date the
        deprecation took effect, as an IMF-fixdate.
      required: false
      schema:
        type: string

    Sunset:
      description: |
        Present when a removal date has been announced. Carries the earliest
        date the operation may stop working, as an IMF-fixdate.
      required: false
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        The request violates the endpoint contract, or its body is not valid
        JSON. Returned with `invalid_request` or `malformed_json`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_request
              message: The request body must not be empty.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    SignatureRequired:
      description: |
        The request between installations is not signed by anybody this installation can verify.

        Every reason is this one answer: no signature, a key whose fingerprint is not the claimed identifier, a signature that does not verify, a timestamp outside the window, a nonce already seen, or — on a room route — a signer who is not somebody here.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthenticated
              message: The request did not carry a usable credential.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    SessionRequired:
      description: |
        The request carried no usable session.

        There is no `WWW-Authenticate` header, deliberately: the credential is a
        cookie, and no authentication scheme is registered for one. Naming a
        scheme Convia does not accept would tell a client to do something that
        cannot work.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthenticated
              message: The request did not carry a usable session.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    SignInRefused:
      description: |
        The username and password do not sign anybody in.

        Every reason produces this one answer: a username nobody has, a wrong
        password, a suspended account, a suspended person. Telling them apart
        would say more about an account than its name.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthenticated
              message: The username and password do not match an account.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    WrongOrigin:
      description: |
        A state-changing request did not come from Convia's own page.

        `Origin` is required on every unsafe method on this surface and matched
        exactly against the address Convia was reached at. Exactly, rather than
        by suffix: a sibling subdomain is *same-site*, so `SameSite=Lax` does
        not see it, and an exact match is what does.

        An absent `Origin` is refused rather than allowed. Browsers have sent
        it on non-GET requests for years, and a request without one did not
        come from a page.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: forbidden
              message: This request did not come from Convia's own page.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    HashingBusy:
      description: |
        Convia declined to verify a password right now.

        **This is not a refusal of the credentials.** Hashing a password costs
        deliberate memory and time, so the number done at once is bounded — the
        alternative is letting anybody who can reach the API decide how much
        memory the process allocates. Beyond the bound, a request waits briefly
        and is then told to come back rather than being queued behind a timeout
        nobody will wait out.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: How many seconds to wait before trying again.
          schema:
            type: integer
          example: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unavailable
              message: Convia is verifying too many passwords at once. Try again in a moment.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    PresenceState:
      description: What Convia will now say about the person.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Presence"

    PresenceUnavailable:
      description: |
        Presence could not be reached, and another attempt shortly may succeed.

        Presence is the one part of Convia with no durable copy to fall back on,
        so this is reported rather than answered as `offline` — telling an
        application that everybody went offline, when what happened is that
        Convia lost its ephemeral store, would be a false statement about
        people rather than a degraded one.

        **Nothing else about the application is affected.** Calls, rooms,
        participants, and webhooks are answered from PostgreSQL and are
        untouched.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: How many seconds to wait before trying again.
          schema:
            type: integer
          example: 5
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unavailable
              message: Presence is temporarily unavailable. Nothing else about this application is affected.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    NotFound:
      description: The requested route or resource does not exist.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: The requested resource does not exist.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    MethodNotAllowed:
      description: The route exists but does not support the request method.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Allow:
          $ref: "#/components/headers/Allow"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: method_not_allowed
              message: The requested method is not supported by this resource.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    ApplicationState:
      description: The application, after the requested lifecycle change.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Application"

    Unauthorized:
      description: |
        The request carried no usable credential.

        Every reason a key can fail — absent, malformed, unknown, wrong,
        revoked, expired, or belonging to an application Convia no longer
        serves — produces this same answer, so the response cannot be used to
        learn which keys exist or which were once valid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          description: The authentication scheme to use.
          schema:
            type: string
            example: Bearer realm="convia"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthenticated
              message: The request did not carry a usable credential.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    RateLimited:
      description: |
        Too many failed authentication attempts from this caller.

        Only failures are counted, so a client presenting a working key never
        meets this. A client that does is presenting one that will not start
        working by being repeated — a revoked or expired key in a retry loop,
        most often — and should read `Retry-After` and back off.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: Whole seconds to wait before attempting again.
          schema:
            type: integer
            minimum: 1
            example: 6
        WWW-Authenticate:
          description: The authentication scheme to use.
          schema:
            type: string
            example: Bearer realm="convia"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: rate_limited
              message: Too many failed authentication attempts. Retry later.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    ServiceUnavailable:
      description: |
        A dependency Convia needs could not be reached, and another attempt may
        succeed.

        It is distinct from `500 internal_error` because the remedy differs. An
        internal error is Convia's to fix and repeating the request will not
        help; this one invites the same request again shortly. Convia does not
        leave anything half-done behind it: a call that could not be
        established does not hold its room.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unavailable
              message: The call could not be established because a dependency is unavailable. Retry shortly.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    Forbidden:
      description: |
        The credential is valid but does not carry the scope this operation
        requires. Presenting a different key will not help; being granted the
        scope will.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: forbidden
              message: The credential does not carry the scope this operation requires.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    UserState:
      description: The user, after the requested lifecycle change.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/User"

    Conflict:
      description: |
        The request is valid but cannot be satisfied in the current state of the
        resource, and repeating it unchanged will not help.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: conflict
              message: The external subject belongs to a deleted user and stays reserved until erasure.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    PreconditionFailed:
      description: |
        The `If-Match` version no longer describes the stored resource, so
        another request changed it first. Nothing was modified.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: precondition_failed
              message: The application was modified by another request. Read it again and retry.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    PayloadTooLarge:
      description: The request body exceeds the accepted size.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: payload_too_large
              message: The request body must not exceed 1048576 bytes.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    UnsupportedMediaType:
      description: The request does not declare an `application/json` body.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unsupported_media_type
              message: The request Content-Type must be application/json.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    InternalError:
      description: |
        The server encountered an unexpected condition. The response never
        contains internal detail; the `request_id` correlates it with the logs.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal_error
              message: The server encountered an unexpected condition.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT
