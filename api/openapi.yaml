    get:
      operationId: listOwnUserRooms
      tags: [Members]
      summary: List the rooms somebody belongs to
      description: |
        Returns one page of the rooms one of the caller's own people belongs to.

        This is what a sidebar is built from. It hangs off the person rather
        than off rooms because that is what it is about, and because the rooms
        listing filters a room's own attributes — membership is not one of
        them.

        Ordered by room identifier, which is the order the index holds, so the
        cursor is the last `room_id` on the page. An identifier naming nobody
        answers `404 not found` rather than an empty page, which a caller would
        read as "they are in no rooms".
      x-lifecycle: experimental
      security:
        - ApplicationKey: ["members:read"]
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/Limit"
