  /v1/users/{user_id}/presence/{device_id}:
    put:
      operationId: assertPresence
      tags: [Presence]
      summary: Report that one device is present
      description: |
        Records or refreshes what one device says about one person, and returns
        what Convia will now say about the **person**.

        This is the heartbeat. Send it every 20 seconds or so and let
        `lifetime_seconds` cover a few missed ones; the default of 60 seconds
        covers three at that interval.

        **No timestamp is sent and none is accepted.** A caller states how long
        its claim should stand, and Convia computes the deadline from its own
        clock. That is why a client with a wrong clock cannot make somebody
        permanently available, and why two Convia instances never disagree
        about when something lapsed.

        When several of a person's devices are asserting at once, the answer is
        the strongest of them: `busy`, then `online`, then `away`. A deliberate
        request not to be disturbed is not undone by a laptop in another room
        reporting activity.

        Requires the `presence:write` scope.
      x-lifecycle: experimental
      x-required-scopes: [presence:write]
      security:
        - ApplicationKey: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/DeviceID"
