      operationId: leaveOwnCall
      tags: [Participants]
      summary: Leave a call
      description: |
        Records that someone left a call of their own accord.

        Leaving twice succeeds and returns the participant unchanged, so a
        client retrying after a timeout is never punished for it, and someone
        who was removed is not quietly converted into someone who left.
      x-lifecycle: experimental
