  /v1/applications/{application_id}/rooms:
    post:
      operationId: createRoom
      tags: [Rooms]
      summary: Create a room
      description: |
        Creates a room belonging to the application.

        An operator acts on a tenant other than itself, so the application is
        named in the path.

        An `alias` is optional and is what makes a room durable: with one, the
        room is addressable by a name the application chose; without one it is
        anonymous and referred to only by its identifier.

        An alias another room already holds is refused with `409 conflict`
        rather than returning that room, because creating and looking up are
        different questions. The alias stays reserved while a room is deleted
        and awaiting erasure, so a cached alias can never come to point at a
        different room.

        Supply an `Idempotency-Key` to make a retry after a timeout safe: the
        room is created at most once, and a repeat returns the original
        response.
      x-lifecycle: experimental
      security:
        - OperatorKey: ["tenants:write"]
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
            example:
              alias: weekly-standup
              name: Weekly Standup
              max_participants: 25
      responses:
        "201":
          description: The room was created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
