        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/PresenceUnavailable"

    delete:
      operationId: withdrawPresence
      tags: [Presence]
      summary: Report that one device is going away
      description: |
        Removes one device's claim and returns what the person's other devices
        still say.

        It answers with the person rather than with no content because closing
        one tab does not usually take somebody offline, and a client that
        assumed it did would be wrong.

        Requires the `presence:write` scope.
      x-lifecycle: experimental
      x-required-scopes: [presence:write]
      security:
