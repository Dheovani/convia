openapi: 3.0.3

info:
  title: Convia API
  version: 0.1.0
  description: |
    Convia is a real-time communication platform. This document is the contract
    for its public HTTP API and for the operational endpoints that surround it.

    Media transport is an internal implementation detail. No field, schema, or
    error in this contract may expose a media provider concept.

    The transport rules that every endpoint follows are described in
    `docs/api-conventions.md`. The compatibility rules that govern changes to
    this document are described in `docs/api-compatibility.md`.
  license:
    name: PolyForm Noncommercial License 1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0

servers:
  - url: http://localhost:8080
    description: Local development instance.

tags:
  - name: Operations
    description: |
      Operational endpoints for operators and deployment infrastructure. They
      are served outside the versioned public API prefix and are not part of the
      public product interface.
  - name: Applications
    description: |
      Administrative endpoints for Convia's tenants.

      These endpoints have no authentication yet, so they are served only when
      an operator explicitly sets `CONVIA_ADMIN_API=enabled`, which is refused
      in production. They exist to bootstrap the first applications and will
      require credentials and administrative scopes once M07 lands.
  - name: Users
    description: |
      The people an application knows about.

      Users are nested under their application because Convia cannot yet infer
      the tenant from a credential. Once M07 lands, an application will address
      its own users without naming itself in the path, and these operator-facing
      routes will remain for administrative use.

      Convia never links users across applications: the same human known to two
      applications is two unrelated Convia users.

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Report service health
      description: |
        Reports that the process is running and able to serve HTTP requests.

        This endpoint does not check downstream dependencies. A readiness
        endpoint that distinguishes process health from dependency availability
        will be introduced with the first durable dependency.
      x-lifecycle: stable
      responses:
        "200":
          description: The service is running.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

  /ready:
    get:
      operationId: getReadiness
      tags: [Operations]
      summary: Report whether the service can handle traffic
      description: |
        Reports whether Convia's dependencies are usable right now.

        Unlike `/health`, this endpoint checks dependencies, so an orchestrator
        should route traffic on readiness and restart on liveness. A failing
        check names the dependency but never explains the failure, because the
        reason would expose infrastructure detail. It is written to the logs
        instead, correlated by request ID.
      x-lifecycle: stable
      responses:
        "200":
          description: Every dependency is usable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ready
                checks:
                  database: ok
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: At least one dependency is unusable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: unavailable
                checks:
                  database: unavailable

  /v1/applications:
    post:
      operationId: createApplication
      tags: [Applications]
      summary: Create an application
      description: |
        Registers a new tenant.

        Convia assigns the identifier, the status, and the timestamps: a client
        can neither choose an identifier nor backdate a tenant. Creation is not
        idempotent yet, so a repeated request creates a second application.
      x-lifecycle: experimental
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequest"
            example:
              name: Workspace Town
      responses:
        "201":
          description: The application was created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listApplications
      tags: [Applications]
      summary: List applications
      description: |
        Returns one page of applications, newest first. Deleted applications are
        not returned.
      x-lifecycle: experimental
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of applications.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/applications/{application_id}:
    get:
      operationId: getApplication
      tags: [Applications]
      summary: Retrieve an application
      description: |
        Returns one application.

        An identifier that does not exist, is malformed, or belongs to a deleted
        application is reported the same way, so that probing reveals nothing
        about which applications exist.
      x-lifecycle: experimental
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "200":
          description: The requested application.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      operationId: renameApplication
      tags: [Applications]
      summary: Rename an application
      description: |
        Changes the display name of an application.

        The name is display metadata and carries no security meaning, so
        renaming an application never changes what it may do.

        Send the `ETag` from a previous read as `If-Match` to make the change
        conditional: the rename then applies only while nothing else has
        changed, and is rejected with `412` otherwise. The header is optional,
        and without it the last write wins.
      x-lifecycle: experimental
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameApplicationRequest"
            example:
              name: Workspace Town
      responses:
        "200":
          description: The renamed application.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteApplication
      tags: [Applications]
      summary: Delete an application
      description: |
        Removes an application from the API surface.

        The record is retained for the erasure window rather than destroyed, so
        the deletion stays recoverable. Deleting an application that is already
        deleted succeeds, because a repeated delete must not fail.
      x-lifecycle: experimental
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "204":
          description: The application was deleted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/applications/{application_id}/suspend:
    post:
      operationId: suspendApplication
      tags: [Applications]
      summary: Suspend an application
      description: |
        Withdraws access without losing data. A suspended application is not
        served, and its data is retained until it is activated again.

        Suspending an already-suspended application changes nothing and reports
        success, so a repeated request is safe.
      x-lifecycle: experimental
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "200":
          $ref: "#/components/responses/ApplicationState"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/applications/{application_id}/activate:
    post:
      operationId: activateApplication
      tags: [Applications]
      summary: Activate an application
      description: |
        Restores a suspended application to normal service.

        Activating an already-active application changes nothing and reports
        success, so a repeated request is safe.
      x-lifecycle: experimental
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "200":
          $ref: "#/components/responses/ApplicationState"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/applications/{application_id}/users:
    post:
      operationId: resolveUser
      tags: [Users]
      summary: Resolve an application's person into a Convia user
      description: |
        Maps one of the application's people to a Convia user, creating the
        mapping the first time it is seen.

        The operation is idempotent by `external_subject`: calling it again
        returns the same user, so an application can call it before every
        session without tracking whether it has called it before. An existing
        user is returned unchanged, so a routine resolve never overwrites a
        display name or metadata that was corrected elsewhere.

        The response is `201` when the mapping was created and `200` when it
        already existed.

        A subject whose user was deleted stays reserved until erasure, so
        resolving it again is refused with `409` rather than reviving the user.
        A suspended user is returned normally, with its status, so the
        application can see the state it set.
      x-lifecycle: experimental
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveUserRequest"
            example:
              external_subject: customer-42
              display_name: Ada Lovelace
              metadata:
                plan: pro
      responses:
        "200":
          description: The mapping already existed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "201":
          description: The mapping was created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listUsers
      tags: [Users]
      summary: List an application's users
      description: |
        Returns one page of the application's users, newest first. Deleted
        users are not returned, and no other application's users can appear.
      x-lifecycle: experimental
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of users.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/applications/{application_id}/users/{user_id}:
    get:
      operationId: getUser
      tags: [Users]
      summary: Retrieve a user
      description: |
        Returns one user of the application.

        An identifier that does not exist, is malformed, belongs to a deleted
        user, or belongs to another application is reported identically, so
        that this endpoint cannot be used to discover which identifiers exist
        elsewhere in Convia.
      x-lifecycle: experimental
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: The requested user.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      operationId: updateUser
      tags: [Users]
      summary: Update a user's attributes
      description: |
        Changes the attributes the application owns.

        Only the fields present in the body change, so a display name can be
        corrected without restating metadata. Metadata is replaced rather than
        merged: the object sent becomes the stored object, which is how a key
        is removed.

        Send the `ETag` from a previous read as `If-Match` to make the change
        conditional: the update then applies only while nothing else has
        changed, and is rejected with `412` otherwise. The header is optional,
        and without it the last write wins.

        A deleted user cannot be updated and is reported as missing.
      x-lifecycle: experimental
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
            example:
              display_name: Ada King
              metadata:
                plan: enterprise
      responses:
        "200":
          description: The updated user.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Delete a user
      description: |
        Removes a user from the API surface.

        The record is retained for the erasure window rather than destroyed, so
        the deletion stays recoverable. Deleting a user that is already deleted
        succeeds, because a repeated delete must not fail.

        The `external_subject` stays reserved by the deleted user until erasure
        frees it, so resolving that subject again is refused with `409` rather
        than reviving the user.
      x-lifecycle: experimental
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: The user was deleted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/applications/{application_id}/users/{user_id}/suspend:
    post:
      operationId: suspendUser
      tags: [Users]
      summary: Suspend a user
      description: |
        Withdraws a user's access without losing data. The record is retained
        until the user is activated again.

        Suspending an already-suspended user changes nothing and reports
        success, so a repeated request is safe.

        Suspension does not free the external subject: resolving it returns the
        suspended user, so the application can see the state it set.
      x-lifecycle: experimental
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          $ref: "#/components/responses/UserState"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/applications/{application_id}/users/{user_id}/activate:
    post:
      operationId: activateUser
      tags: [Users]
      summary: Activate a user
      description: |
        Restores a suspended user to normal service.

        Activating an already-active user changes nothing and reports success,
        so a repeated request is safe. A deleted user cannot be activated and is
        reported as missing.
      x-lifecycle: experimental
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          $ref: "#/components/responses/UserState"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  schemas:
    User:
      type: object
      description: |
        One application's view of one of its people.

        Convia is authoritative for `id`, `application_id`, `status`, and the
        timestamps. The remaining fields belong to the application and are
        stored without interpretation.
      required: [id, application_id, external_subject, metadata, status, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        external_subject:
          type: string
          description: |
            The identifier the application already uses for this person. Convia
            stores it opaquely and never parses it. It is scoped to the
            application, so two applications may use the same value without any
            relationship between the resulting users.
          minLength: 1
          maxLength: 255
          example: customer-42
        display_name:
          type: string
          description: Application-owned display name. Absent when none was supplied.
          minLength: 1
          maxLength: 120
          example: Ada Lovelace
        metadata:
          $ref: "#/components/schemas/UserMetadata"
        status:
          type: string
          description: |
            Lifecycle state. `active` is served normally, `suspended` retains
            data while refusing new work, and `deleted` is gone from the API.
          enum: [active, suspended, deleted]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    UserPage:
      type: object
      description: One page of users.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          type: string
          description: |
            Opaque token that returns the next page. Absent on the last page.
            Clients must not decode or construct it.

    ResolveUserRequest:
      type: object
      description: The accepted body when resolving an identity.
      required: [external_subject]
      additionalProperties: false
      properties:
        external_subject:
          type: string
          description: |
            The identifier the application uses for this person. Prefer a
            stable internal identifier over an email address: Convia stores
            whatever it receives, and an email carries personal data Convia
            does not need.
          minLength: 1
          maxLength: 255
        display_name:
          type: string
          description: Optional display name, owned by the application.
          maxLength: 120
        metadata:
          $ref: "#/components/schemas/UserMetadata"

    UpdateUserRequest:
      type: object
      description: |
        The accepted body when changing the attributes an application owns.

        Only the fields present in the body change; an omitted field keeps its
        stored value. Sending `display_name` as an empty string clears it, and
        `metadata` is replaced wholesale rather than merged, so a key is removed
        by sending the object without it.

        At least one field must be present.
      minProperties: 1
      additionalProperties: false
      properties:
        display_name:
          type: string
          description: Optional display name, owned by the application.
          maxLength: 120
        metadata:
          $ref: "#/components/schemas/UserMetadata"

    UserMetadata:
      type: object
      description: |
        Application-owned key-value data that Convia stores without
        interpreting. At most 16 entries, keys of at most 40 characters made of
        lowercase letters, digits, and underscores and starting with a letter,
        values of at most 256 characters, and at most 4096 bytes in total.

        Values are strings only: nested objects and arrays are rejected so the
        stored shape stays predictable. An application that wants an avatar
        stores its URL here.
      additionalProperties:
        type: string
        maxLength: 256
      example:
        plan: pro
        avatar_url: https://example.test/avatars/42.png

    UserId:
      type: string
      description: |
        Opaque, immutable public identifier. Clients store it as a reference and
        must never parse it.
      pattern: "^usr_[A-Z2-7]{26}$"
      example: usr_7KQZP4XN2VJH6TBWMDR3YAFC5E

    Application:
      type: object
      description: A Convia tenant.
      required: [id, name, status, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/ApplicationId"
        name:
          type: string
          description: Display name. It carries no security meaning.
          minLength: 1
          maxLength: 120
          example: Workspace Town
        status:
          type: string
          description: |
            Lifecycle state. `active` is served normally, `suspended` retains
            data while refusing new work, and `deleted` is gone from the API.
          enum: [active, suspended, deleted]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    ApplicationPage:
      type: object
      description: One page of applications.
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        next_cursor:
          type: string
          description: |
            Opaque token that returns the next page. Absent on the last page.
            Clients must not decode or construct it.

    RenameApplicationRequest:
      type: object
      description: The accepted body when renaming an application.
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: |
            New display name. Surrounding whitespace is insignificant, and
            control characters are rejected.
          minLength: 1
          maxLength: 120

    CreateApplicationRequest:
      type: object
      description: The accepted body when creating an application.
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: |
            Display name. Surrounding whitespace is insignificant, and control
            characters are rejected.
          minLength: 1
          maxLength: 120

    ApplicationId:
      type: string
      description: |
        Opaque, immutable public identifier. Clients store it as a reference and
        must never parse it.
      pattern: "^app_[A-Z2-7]{26}$"
      example: app_MXHJAY4MJNX2FO22XWJ3XNCKHT

    Timestamp:
      type: string
      format: date-time
      description: UTC RFC 3339 timestamp with millisecond precision.
      example: "2026-09-05T14:04:56.154Z"

    Readiness:
      type: object
      description: Readiness of Convia and of each dependency it requires.
      required: [status, checks]
      additionalProperties: false
      properties:
        status:
          type: string
          description: Aggregate readiness. `ready` only when every check passes.
          enum: [ready, unavailable]
        checks:
          type: object
          description: Result of each dependency check, keyed by dependency name.
          additionalProperties:
            type: string
            enum: [ok, unavailable]

    Health:
      type: object
      description: Health of the Convia process.
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          description: Always `ok` when the process can serve requests.
          enum: [ok]

    ErrorCode:
      type: string
      description: |
        Stable, machine-readable identifier of a failure. Clients branch on this
        value rather than on the human-readable message. Adding a code is an
        additive change; changing the meaning of an existing code is breaking.
      enum:
        - invalid_request
        - malformed_json
        - unsupported_media_type
        - payload_too_large
        - not_found
        - method_not_allowed
        - precondition_failed
        - conflict
        - internal_error

    Error:
      type: object
      description: |
        The single error representation used by every Convia failure, including
        failures produced by routing and middleware.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: |
                Human-readable description for developers. It may change at any
                time and must never be parsed or matched by clients.
            request_id:
              type: string
              description: |
                Correlation identifier of the failed request, matching the
                `X-Request-ID` response header. Quote it in support requests.

  parameters:
    ApplicationID:
      name: application_id
      in: path
      required: true
      description: Identifier of the application.
      schema:
        $ref: "#/components/schemas/ApplicationId"

    UserID:
      name: user_id
      in: path
      required: true
      description: Identifier of the user, within the application in the path.
      schema:
        $ref: "#/components/schemas/UserId"

    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Entity tag from a previous read. When present, the update applies only
        while the resource still carries that version. Only a strong validator
        is honored; `*` and weak validators are treated as no condition.
      schema:
        type: string
      example: '"9f2c1d4b8a3e5f60"'

    Limit:
      name: limit
      in: query
      required: false
      description: |
        Maximum number of items to return in one page. Values above the maximum
        are rejected with `invalid_request` rather than silently clamped.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 25

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque continuation token returned by a previous page. Clients must not
        construct, decode, or persist cursors beyond the paging sequence.
      schema:
        type: string
        maxLength: 512

  headers:
    RequestId:
      description: |
        Correlation identifier of the request. Convia echoes a safe
        client-supplied `X-Request-ID` and otherwise generates one.
      required: true
      schema:
        type: string
        maxLength: 128

    Allow:
      description: Methods supported by the requested resource.
      required: true
      schema:
        type: string

    ETag:
      description: |
        Opaque version of the returned resource. Send it back as `If-Match` to
        make a later update conditional. Clients compare it, never parse it.
      required: true
      schema:
        type: string

    Deprecation:
      description: |
        Present when the operation is deprecated. Carries the date the
        deprecation took effect, as an IMF-fixdate.
      required: false
      schema:
        type: string

    Sunset:
      description: |
        Present when a removal date has been announced. Carries the earliest
        date the operation may stop working, as an IMF-fixdate.
      required: false
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        The request violates the endpoint contract, or its body is not valid
        JSON. Returned with `invalid_request` or `malformed_json`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_request
              message: The request body must not be empty.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    NotFound:
      description: The requested route or resource does not exist.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: The requested resource does not exist.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    MethodNotAllowed:
      description: The route exists but does not support the request method.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Allow:
          $ref: "#/components/headers/Allow"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: method_not_allowed
              message: The requested method is not supported by this resource.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    ApplicationState:
      description: The application, after the requested lifecycle change.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Application"

    UserState:
      description: The user, after the requested lifecycle change.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/User"

    Conflict:
      description: |
        The request is valid but cannot be satisfied in the current state of the
        resource, and repeating it unchanged will not help.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: conflict
              message: The external subject belongs to a deleted user and stays reserved until erasure.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    PreconditionFailed:
      description: |
        The `If-Match` version no longer describes the stored resource, so
        another request changed it first. Nothing was modified.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: precondition_failed
              message: The application was modified by another request. Read it again and retry.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    PayloadTooLarge:
      description: The request body exceeds the accepted size.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: payload_too_large
              message: The request body must not exceed 1048576 bytes.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    UnsupportedMediaType:
      description: The request does not declare an `application/json` body.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unsupported_media_type
              message: The request Content-Type must be application/json.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT

    InternalError:
      description: |
        The server encountered an unexpected condition. The response never
        contains internal detail; the `request_id` correlates it with the logs.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal_error
              message: The server encountered an unexpected condition.
              request_id: MXHJAY4MJNX2FO22XWJ3XNCKHT
