  /v1/accounts:
    post:
      operationId: register
      tags: [Sessions]
      summary: Create an account
      description: |
        Creates an account for the person asking and signs them in, returning
        the session as a cookie.

        The account's identifier is the fingerprint of a key pair generated
        for it, and the private half is stored only sealed by the password
        given here. **Nothing can reset that password**: forgetting it loses
        the account, because nothing else opens its key.

        A username that is taken answers `409`, which necessarily says the name
        exists — a registration form cannot avoid it, and a username is half of
        a handle that is meant to be shared.

        Every attempt is charged to the caller's address, **successes
        included**, because what this guards against is somebody succeeding too
        often: twenty an hour, then `429`.

        The request must come from Convia's own page. `Origin` is required and
        matched exactly, and it is checked before the attempt is charged.
      x-lifecycle: experimental
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "201":
          description: |
            The account exists and its owner is signed in. The session travels
            in a `Set-Cookie` header; the body says who they are.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/WrongOrigin"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/HashingBusy"

  /v1/sessions:
    post:
      operationId: signIn
      tags: [Sessions]
      summary: Sign in
      description: |
        Exchanges a username and a password for a session, returned as a
        cookie.

        **Every failure answers identically.** A username nobody has, a wrong
        password, a suspended account, and a suspended person are one
        `401 unauthenticated` with one message. Convia hashes a decoy password
        when the username is unknown, so the timing is the same too.

        Failed attempts are budgeted per caller address, separately and far
        more tightly than the rest of the API: a password can be guessed where
        an API key cannot.

        The request must come from Convia's own page. `Origin` is required and
        matched exactly.
      x-lifecycle: experimental
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "201":
          description: |
            Signed in. The session travels in a `Set-Cookie` header; the body
            says who signed in.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRefused"
        "403":
          $ref: "#/components/responses/WrongOrigin"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/HashingBusy"

    delete:
      operationId: signOutEverywhere
      tags: [Sessions]
      summary: Sign out of every session
      description: |
        Ends every session the account holds, **including the one making the
        request**.

        Somebody reaching for this believes a device was lost. Sparing the
        browser asking would mean the operation did not do what it says.
      x-lifecycle: experimental
      security:
        - SessionCookie: []
      responses:
        "204":
          description: Every session was ended and this browser's cookie cleared.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/ClearedSessionCookie"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/WrongOrigin"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/sessions/current:
    delete:
      operationId: signOut
      tags: [Sessions]
      summary: Sign out
      description: |
        Ends the session the request carried, and clears the cookie.

        Only the first of those is the sign-out. A session token is a bearer
        credential, so Convia revokes the row rather than trusting the client
        to forget it; clearing the cookie is a courtesy to a browser that will
        otherwise keep sending something that no longer works.

        It answers the same way whether or not the session was still live, so
        it cannot be used to ask whether one is.
      x-lifecycle: experimental
      security:
        - SessionCookie: []
      responses:
        "204":
          description: The session was ended and the cookie cleared.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/ClearedSessionCookie"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/WrongOrigin"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me/rooms:
    get:
      operationId: readMySidebar
      tags: [Me]
      summary: The rooms I am in
      description: |
        Returns the rooms the signed-in person belongs to, with how much they have not read in each.

        This is the sidebar. It names nobody: there is one answer per session, and it is the session's. No request field could ask for somebody else's.

        The unread count travels with the room rather than being fetched per room, because a sidebar is redrawn constantly and a request per row on the screen is the shape that makes an interface feel slow. Convia counts them all in one statement for the same reason.

        A membership whose room has been deleted is skipped rather than reported. Rooms are deleted softly and memberships outlive them until erasure, so it is an ordinary state — and a sidebar that failed because one row had been deleted would be a whole screen lost to a room nobody can open anyway.
      x-lifecycle: experimental
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/MembershipCursor"
      responses:
        "200":
          description: The rooms this person is in.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sidebar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      operationId: createMyRoom
      tags: [Me]
      summary: Open a room
      description: |
        Opens a room with the signed-in person already in it.

        **The body carries a name and nothing else.** An alias is the application's own namespace, metadata is the application's own data, and a capacity is a policy — a person setting any of them would be deciding something on the application's behalf, and an alias in particular would let one person squat a name the application meant to use.

        The person is in the room from the moment it exists: the room and its first member are written together. Written separately, a failure between them would leave a room nobody is in, and on this surface a room nobody is in is a room no person can ever reach.

        `403 forbidden` answers both a request that did not come from Convia's own page and a person whose user the application has suspended.
      x-lifecycle: experimental
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnRoomRequest"
            example:
              name: Weekend plans
      responses:
        "201":
          description: The room was opened, with this person in it.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnRoom"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/WrongOrigin"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/me/rooms/{room_id}/members:
    get:
      operationId: listMyRoomMembers
      tags: [Me]
      summary: Who is in a room I am in
      description: |
        Returns one page of the people in a room the signed-in person belongs to, by the names they go by.

        Unlike the application surface, each member carries a display name. An application owns its people's names and reads them itself; a person has no other way to learn what to call somebody, and everybody listed is somebody they already share this room with.

        A room this person is not in answers `404 not found`.
      x-lifecycle: experimental
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/MembershipCursor"
      responses:
        "200":
          description: One page of the people in the room.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/me/rooms/{room_id}/members/{user_id}:
    put:
      operationId: addMyRoomMember
      tags: [Me]
      summary: Add somebody to a room I am in
      description: |
        Gives somebody a place in a room the signed-in person is in.

        **Only somebody this person already shares a room with can be added.** That is the whole of discovery on this surface. A lookup by address would confirm whether an address has an account, and the sign-in form already refuses to be that oracle.

        Every reason somebody cannot be added is the same `404 not found`: an identifier that names nobody, a stranger, and somebody who shares a room but is suspended. Distinguishing them would reveal which identifiers exist, or another person's suspension. A room this person is not in answers `404` as well.

        Idempotent by the person, as on the application surface: `201` the first time and `200` afterwards.

        There is no way to remove somebody else. Membership carries no role for that power to rest on.
      x-lifecycle: experimental
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: The person was already in the room.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomMember"
        "201":
          description: The person was given a place.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomMember"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/WrongOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/me/rooms/{room_id}/leave:
    post:
      operationId: leaveMyRoom
      tags: [Me]
      summary: Leave a room
      description: |
        Takes the signed-in person's own place in a room away.

        A `POST` to an action rather than a `DELETE` on a member's address: the address would have to name a person, and the only person it could ever name on this surface is the caller.

        What they said stays, as it does when an application removes somebody. A room this person is not in answers `404 not found`, and so does a second attempt to leave.
      x-lifecycle: experimental
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "204":
          description: The person is no longer in the room.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/WrongOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/me/people:
    get:
      operationId: listMyPeople
      tags: [Me]
      summary: People I could add
      description: |
        Returns one page of the people the signed-in person shares a room with — everybody they could add to a room of theirs.

        A room that has been deleted introduces nobody, and a suspended person is left out: they cannot be given a place, and listing them would tell somebody about another person's suspension. The signed-in person is not listed.

        Ordered by the person's identifier; the cursor is the last `user_id` on the page.
      x-lifecycle: experimental
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/MembershipCursor"
      responses:
        "200":
          description: One page of the people this person could add.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/me/events:
    get:
      operationId: streamMyEvents
      tags: [Me]
      summary: Listen to the rooms I am in
      description: |
        Upgrades the connection to a WebSocket and delivers the events about the rooms the signed-in person is in, as they happen. It is how Convia's own interface stops asking every few seconds.

        **It carries only what the person could already read.** That is `message.posted`, `message.edited`, `message.deleted`, `room.member_added`, and `room.member_removed`, each delivered only when it names a room the person is in. A change to the person's own place is delivered when they were in the room before it or are in it after, so being added and being removed both arrive. Calls, participants, and presence are absent because nothing on this surface reads them yet. The envelope is the same `Event` an application receives, without `correlation_id`: the request that caused something was usually somebody else's.

        Which rooms is read before the upgrade, kept current by the membership events the stream carries, and read again every minute, when the session is also checked again. A session that stops authenticating — signed out, expired, or suspended — ends the stream with close code `4001`, which a reconnect would not change. Within that minute a stream may still carry events about a room its person has just left; what they name is identifiers, and reading any of it asks for membership again.

        Like every state-changing request on this surface, and unlike every other `GET`, the handshake must come from Convia's own page: an `Origin` other than this one is refused with `403 forbidden`, because the connection would go on carrying whatever the cookie is entitled to.

        The stream is one direction and stores nothing, exactly as `GET /v1/events` describes. A client that reconnects, or is closed with `4000`, re-reads what it shows. `docs/events.md` has the close codes in full.
      x-lifecycle: experimental
      security:
        - SessionCookie: []
      parameters:
        - name: Connection
          in: header
          required: true
          description: Must be `Upgrade`.
          schema:
            type: string
        - name: Upgrade
          in: header
          required: true
          description: Must be `websocket`.
          schema:
            type: string
        - name: Sec-WebSocket-Version
          in: header
          required: true
          description: Must be `13`, the version RFC 6455 defines.
          schema:
            type: string
        - name: Sec-WebSocket-Key
          in: header
          required: true
          description: The client's handshake nonce, as RFC 6455 requires.
          schema:
            type: string
      responses:
        "101":
          description: |
            The connection is now a WebSocket carrying `Event` objects as text messages, one event per message.

            Convia sends a ping every 30 seconds and closes the connection if it is not answered within 10.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/WrongOrigin"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/me/rooms/{room_id}/messages:
    get:
      operationId: readMyHistory
      tags: [Me]
      summary: Read a room I am in
      description: |
        Returns one window of what was said in a room the signed-in person belongs to.

        Paging works exactly as it does on the application surface: keyset on the sequence, `older` backwards from the newest and `newer` forwards from a position, with the cursor being a message's `sequence`.

        **A room this person is not in answers `404 not found`, never `403 forbidden`.** A refusal that separates "not yours" from "does not exist" confirms to somebody outside a conversation that the conversation is happening, which is most of what they were asking. The application surface is entitled to that distinction; a person is not.
      x-lifecycle: experimental
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/MessageCursor"
        - $ref: "#/components/parameters/HistoryDirection"
      responses:
        "200":
          description: One window of the room's history.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    post:
      operationId: sayInMyRoom
      tags: [Me]
      summary: Say something in a room I am in
      description: |
        Records something the signed-in person said.

        **The body carries what they wrote and nothing else — there is no author field.** That is the whole difference between this surface and the application one. An application names which of its people is speaking because it is acting on their behalf and is the only party that knows; a person cannot name anybody, because naming somebody would mean naming somebody else. Writing as another person is not refused here, it is unrepresentable.

        A room this person is not in answers `404 not found`. A closed room answers `409 conflict`.
      x-lifecycle: experimental
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnMessageRequest"
            example:
              body: On my way.
      responses:
        "201":
          description: The message was recorded.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/WrongOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/me/rooms/{room_id}/read_state:
    get:
      operationId: readMyReadState
      tags: [Me]
      summary: How far I have read in a room
      description: |
        Reports how far the signed-in person has read in a room they belong to, and how much they have not.

        It names nobody, for the same reason the sidebar does not: there is one answer per session.
      x-lifecycle: experimental
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: How far they have read.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadState"
        "400":
