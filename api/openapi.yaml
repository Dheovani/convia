        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/messages/{message_id}/delete:
    post:
      operationId: withdrawOwnMessage
      tags: [Messages]
      summary: Withdraw a message
      description: |
        Withdraws a message, leaving a tombstone where it was.

        The row stays, keeps its position in the history, and loses its body.
        Two reasons: a history that closed over the hole would move every later
        message and slide some past a client's cursor unseen, and "this message
        was deleted" is what a reader expects to see — text that silently
        vanishes is more confusing than an acknowledged absence.

        This is a `POST` to a sub-resource rather than a `DELETE` on the
        message, because the request has to name **which person** is
        withdrawing it and a `DELETE` carrying a body is a shape many clients
        cannot send. Removing a participant is spelled the same way for the
        same reason.

        The reply is the tombstone rather than `204 no content`, because a
        client needs the `deleted_at` it now carries in order to render it.

        **Only the author may withdraw**, and naming somebody else answers
        `409 conflict`. Withdrawing a message that is already withdrawn is not
        an error: the caller asked for a state the message is in.
      x-lifecycle: experimental
      security:
        - ApplicationKey: ["messages:write"]
      parameters:
        - $ref: "#/components/parameters/MessageID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageAuthor"
            example:
