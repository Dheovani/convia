  /v1/me:
    get:
      operationId: getMe
      tags: [Sessions]
      summary: Who is signed in
      description: |
        Reports the person the session belongs to.

        This is the first request a freshly loaded page makes, every time, to
        decide whether to show a sign-in form — so a request carrying no cookie
        is an ordinary `401` that costs nothing and is not treated as a failed
        attempt.

        `user_id` is the identifier every other part of Convia addresses this
        person by, so a client can recognize itself in a roster without asking
        again.
