  /v1/participants/{participant_id}/remove:
    post:
      operationId: removeOwnParticipant
      tags: [Participants]
      summary: Remove a participant
      description: |
        Puts someone out of one of the caller's own calls.

        Naming an acting participant in `by` makes Convia check that
        participant is a moderator of the same call. Without one, the
        application removes on its own authority, which it holds over its own
        calls.

        Convia does not decide whether the application may remove someone: it
        already may. What Convia decides is whether the moderator it was told
        about is one, since Convia is what holds the roster. A participant who
        is not a moderator answers `403 forbidden`.

        Someone removed cannot rejoin the call.

        Removing someone who has already gone succeeds and returns them
        unchanged, so a retry after a timeout is never punished. It does not
        overwrite who removed them the first time, and it does not convert
        someone who left into someone who was removed.
      x-lifecycle: experimental
      security:
        - ApplicationKey: ["participants:write"]
      parameters:
        - $ref: "#/components/parameters/ParticipantID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveParticipantRequest"
            example:
              by: part_7KQZP4XN2VJH6TBWMDR3YAFC5E
              reason: Disruptive behaviour.
      responses:
