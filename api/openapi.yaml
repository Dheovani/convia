        Returns what Convia will say about each named user, in the order asked.

        Every named user is answered for, including the ones nothing is being
        asserted about — those come back as `offline`. A user the application
        does not have is reported as `404` rather than answered as offline,
        because that is a mistake in the request and reporting it as an absence
