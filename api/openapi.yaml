        "500":
          $ref: "#/components/responses/InternalError"

  /v1/participants/{participant_id}/session:
    post:
      operationId: createOwnParticipantSession
      tags: [Participants]
      summary: Issue connection instructions for a participant
      description: |
        Returns everything a client needs to join the conversation, and nothing
        else.

        This is the endpoint that makes a call audible. Everything before it
        records who may take part; this hands one of those people a
        short-lived credential for one call. An application asks on its
        client's behalf and passes the answer on, so the client never holds
        the application's API key and never talks to Convia's media
        infrastructure directly.

        **Convia decides afresh every time.** A participant who left, was
        removed, whose user was suspended, or whose call has ended receives
        nothing, however recently they were admitted. That is what makes a
        removal take effect: the media plane is never told about it, so what
        stops someone coming back is that Convia stops issuing.

        **The credential expires quickly**, which is deliberate. It is
        presented once, to open a connection, and the connection outlives it —
        nothing forces anyone out when it expires. What the short life bounds
        is how long a copy taken from a log or an old device can still be used
        to walk into a conversation. A client that has not connected by
        `expires_at`, or that loses its connection after it, asks for another
        by calling this again.

        An `Idempotency-Key` is honoured and is worth sending. Unlike joining,
        this mints something new on every call, so a request that timed out
        would otherwise leave a usable credential behind that nobody received.

        A deployment configured with no media plane answers `503 unavailable`.
        That is not a fault: a Convia that only runs the control plane is a
        supported deployment, and every other participant operation works in
        it.
      x-lifecycle: experimental
      security:
        - ApplicationKey: ["participants:write"]
      parameters:
        - $ref: "#/components/parameters/ParticipantID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Connection instructions for this participant.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/calls/{call_id}/invitations:
    post:
      operationId: createOwnInvitation
      tags: [Invitations]
      summary: Invite someone to a call
      description: |
        Issues an invitation: permission for one person to join one call, as a
        credential they present themselves.

        This is different in kind from admitting somebody directly. An
        application that admits a user has decided, and Convia records the
        decision. An invitation is a decision the *invitee* completes, by
        presenting something Convia issued to the party that holds it — which
        is what makes expiry and revocation rules Convia enforces rather than
        notes the application keeps.

        **The token is returned exactly once.** Convia stores only a digest and
        cannot show it again, in the same way it cannot show an API key again.
        Hand it to the person it is for; if it is lost, issue another.

        The role travels with the invitation, so somebody invited as a
        moderator arrives as one without the application having to promote them
        after the fact.

        Issuing one to a suspended user is allowed, deliberately. An invitation
        is permission for later, and whether somebody may actually take part is
        settled when they redeem it.
      x-lifecycle: experimental
      security:
        - ApplicationKey: ["invitations:write"]
      parameters:
        - $ref: "#/components/parameters/CallID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
            example:
              user_id: usr_7KQZP4XN2VJH6TBWMDR3YAFC5E
              role: member
              expires_in_seconds: 86400
      responses:
        "201":
          description: The invitation, with the token its holder presents.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

