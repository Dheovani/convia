    get:
      operationId: readOwnMessage
      tags: [Messages]
      summary: Read one message
      description: |
        Returns one message from the caller's own application.

        A message is addressed directly, without its room, because a client
        holding an identifier should not have to remember where it came from.
        A message belonging to another application answers `404 not found`.
