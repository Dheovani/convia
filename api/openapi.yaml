        chose is one it may have reused. Convia keeps it — it has to, since it
        signs every delivery with it — so "once" here means that no read ever
        returns it. Losing it is recovered by rotating, not by asking again.

        The destination is checked before this answers: its shape, and whether
        it resolves to an address Convia is willing to connect to. It is
        checked again at every delivery, because what a name resolves to can
        change.
