        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/rooms/{room_id}/messages:
    post:
      operationId: postOwnRoomMessage
      tags: [Messages]
      summary: Say something in a room
      description: |
        Records something one of the caller's own people said in one of the
        caller's own rooms.

        The room is named in the path because **a conversation is a room**:
        there is no separate conversation resource, and a room's messages are
        its history. Messages outlive the calls held in the room.

        The body names **which person** is speaking, as either `user_id` or
        `invitation_id` and exactly one of the two. An invitation identifies a
        guest, who Convia knows nothing else about. The tenant comes from the
        presented credential, so no request field could name another
        application's room or person.

        The reply carries a `sequence`: the message's position in this room's
        history. It is what orders a room, and it is not a timestamp — see the
        `Message` schema.

        A closed room answers `409 conflict`; a deleted one answers
        `404 not found`.

        Supply an `Idempotency-Key` to make a retry after a timeout safe. This
        is the operation where it matters most: a duplicated room is an
        administrative annoyance, while a message sent twice is something
        everybody in the room sees.
      x-lifecycle: experimental
      security:
        - ApplicationKey: ["messages:write"]
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
            example:
              user_id: usr_7QK4XMZP2VJH6TBWNDR3YAFC5E
              body: Standup in five minutes.
      responses:
        "201":
          description: The message was recorded.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    get:
      operationId: readOwnRoomHistory
      tags: [Messages]
      summary: Read a room's history
      description: |
        Returns one window of what was said in one of the caller's own rooms.

        Paging is by **keyset on the sequence**, in one of two directions,
        because the two readings a client performs are genuinely different:

        - `older` — backwards from the newest. This is opening a room, and it
          is the default.
        - `newer` — forwards from a position. This is catching up after being
          away.

        The `cursor` is a message's `sequence` rather than an opaque token.
        Unlike a room listing's cursor, which wraps an internal pair, a
        sequence is already published in every message and is what read state
        is expressed in, so hiding it would be ceremony. Omitting it starts
        from the end the direction begins at.

        Withdrawn messages appear as tombstones: they keep their position and
        carry `deleted: true` with no `body`. A history that closed over the
        hole would move every later message and slide some past a client's
        cursor unseen.

        A room that is not the caller's answers `404 not found` rather than an
        empty page, which would otherwise read as "nothing was ever said
        here".
      x-lifecycle: experimental
      security:
        - ApplicationKey: ["messages:read"]
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/MessageCursor"
        - $ref: "#/components/parameters/HistoryDirection"
      responses:
        "200":
          description: One window of the room's history.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/rooms/{room_id}/read_state:
    put:
      operationId: markOwnRoomRead
      tags: [Messages]
      summary: Mark a room read
      description: |
        Records that one of the caller's own people has read a room up to a
        position.

        **Read state is durable, and presence is not.** Presence is a claim with
        an expiry, honestly described as "this was true a moment ago". Read
        state is a fact about something a person did: it does not decay, and a
        badge that came back because a laptop closed would be wrong in a way
        people notice immediately.

        It is a **position, not a set**. Convia records the furthest sequence
        reached, never which messages were read — the set would be the size of
        the history times the number of readers, and nothing needs to know that
        message 12 was read while 11 was not.

        **It only ever moves forward.** A mark at or behind the stored position
        is accepted and changes nothing rather than being refused: two devices
        report independently and out of order, and a phone finishing a second
        after the laptop must not pull the badge backwards. The reply is
        therefore the position that now holds, which is not always the one that
        was sent.

        A position beyond the room's newest message answers `400
        invalid_request`. Accepting it would make the unread count negative and
        would silently suppress messages the client never received.

        `PUT` rather than `POST` because it sets a position rather than
        appending to anything, and sending it twice is the same outcome as
        sending it once.
      x-lifecycle: experimental
      security:
        - ApplicationKey: ["messages:write"]
      parameters:
        - $ref: "#/components/parameters/RoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadStateRequest"
            example:
              user_id: usr_7QK4XMZP2VJH6TBWNDR3YAFC5E
              sequence: 42
      responses:
        "200":
          description: The position that now holds.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    get:
      operationId: readOwnRoomReadState
      tags: [Messages]
      summary: Read how far somebody has read
      description: |
        Reports how far one of the caller's own people has read in a room, and
        how much they have not.

        `unread` is derived from `sequence` on every read rather than stored, so
        the two cannot drift apart. It excludes two things, and both are product
        decisions rather than optimizations: **the person's own messages**,
        because nobody has an unread message from themselves and a badge that
        counted them would light up as they typed; and **withdrawn messages**,
        because a tombstone is the absence of something to read.

        Somebody who has never opened the room is not an error. They read
        nothing, so `sequence` is `0` — a position nothing occupies, since
        messages count from one — and `updated_at` is absent.

        The person is named in the query rather than in a body, because this is
        a read and a `GET` carrying a body is a shape caches and proxies
        mishandle.

        It needs `messages:read` rather than `messages:write`: the unread count
        is derived from the history, so answering it tells the caller how much
        of a conversation exists that they have not seen.
      x-lifecycle: experimental
      security:
        - ApplicationKey: ["messages:read"]
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - $ref: "#/components/parameters/ReaderID"
