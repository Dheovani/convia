    patch:
      operationId: editOwnMessage
      tags: [Messages]
      summary: Change what a message says
      description: |
        Replaces the body of a message and records that it was edited.

        **Only the author may edit.** The request names which person is
        editing, and Convia compares that against the stored message: naming
        somebody else answers `409 conflict`, not `403 forbidden`, because the
        credential was granted everything this surface can grant and a
        different scope would not help. It named the wrong person.

        Convia records **that** a message was edited, in `edited_at`, and not
        what it said before. Keeping the previous text would double the storage
        of the most abundant row in the system and create a second copy to find
        when somebody asks to be erased.

        A withdrawn message answers `409 conflict`: the author already decided
        to remove it, and an edit must not be able to put it back.
