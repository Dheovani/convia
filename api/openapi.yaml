  /v1/me/password:
    patch:
      operationId: changePassword
      tags: [Sessions]
      summary: Change your password
      description: |
        Replaces the password, having checked the current one.

        Three things happen together, and the grouping is the point:

        - the password changes;
        - **every other session is ended**, because the ordinary reason to
          change a password is believing somebody else has it;
        - **this session is rotated** — a new session, a new secret, a new
          cookie — because the token in this browser may have leaked too, and
          keeping it alive would keep the leak alive.

        So the person stays signed in here and nowhere else. The current
        password is required: a stolen session must not be enough to lock the
        owner out of their own account. The account's key is sealed again under
        the new password and is otherwise unchanged, so the account identifier
        and handle stay what they were.
      x-lifecycle: experimental
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "204":
          description: |
            The password was changed. The rotated session travels in a
            `Set-Cookie` header.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/WrongOrigin"
        "405":
