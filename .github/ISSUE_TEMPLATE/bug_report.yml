name: Bug report
description: Report incorrect behavior in Convia
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for security vulnerabilities. Report those privately through a
        [security advisory](https://github.com/Dheovani/convia/security/advisories/new), as described in `SECURITY.md`.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong, in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that reproduces the problem. Include the exact requests or commands.
      placeholder: |
        1. Start the service with `go run ./cmd/convia`
        2. Send `curl -i http://localhost:8080/...`
        3. Observe the response
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the response, the error, and any relevant log lines. Redact credentials, tokens, and personal data.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Convia version
      description: The commit SHA, tag, or container image you are running.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Go version, and whether you run the binary or the container image.
      placeholder: Ubuntu 24.04, Go 1.26.6, container image
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps, such as configuration, a reverse proxy in front of Convia, or how often it reproduces.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This is not a security vulnerability
          required: true
        - label: I searched existing issues for a duplicate
          required: true
        - label: I removed credentials, tokens, and personal data from everything I pasted
          required: true
