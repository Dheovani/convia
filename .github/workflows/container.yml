name: Container

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Build and smoke test image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag convia:ci .

      - name: Verify non-root runtime user
        shell: bash
        run: |
          runtime_user="$(docker image inspect --format '{{.Config.User}}' convia:ci)"
          if [[ "${runtime_user}" != "65532:65532" ]]; then
            echo "Unexpected container user: ${runtime_user}"
            exit 1
          fi

      - name: Start PostgreSQL
        shell: bash
        run: |
          docker network create convia-ci
          docker run --detach --name convia-ci-postgres --network convia-ci \
            --env POSTGRES_USER=convia \
            --env POSTGRES_PASSWORD=convia \
            --env POSTGRES_DB=convia \
            postgres:17-alpine

          # The postgres image runs initdb against a temporary socket-only
          # server, then restarts. A socket probe therefore reports ready while
          # TCP is still refused, so readiness is checked over TCP: that is the
          # path the following steps actually use.
          for _ in {1..60}; do
            if docker exec convia-ci-postgres \
              pg_isready --host 127.0.0.1 --username=convia --dbname=convia >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done

          echo "PostgreSQL did not become ready within 60 seconds"
          docker logs convia-ci-postgres
          exit 1

      - name: Apply migrations using the image
        env:
          CONVIA_DATABASE_URL: postgres://convia:convia@convia-ci-postgres:5432/convia?sslmode=disable
        run: |
          docker run --rm --network convia-ci \
            --env CONVIA_DATABASE_URL="${CONVIA_DATABASE_URL}" \
            convia:ci migrate up

      - name: Smoke test health and readiness
        shell: bash
        env:
          CONVIA_DATABASE_URL: postgres://convia:convia@convia-ci-postgres:5432/convia?sslmode=disable
        run: |
          container_id="$(docker run --detach --network convia-ci --publish 127.0.0.1::8080 \
            --env CONVIA_DATABASE_URL="${CONVIA_DATABASE_URL}" convia:ci)"
          trap 'docker logs "${container_id}" || true; docker rm --force "${container_id}" >/dev/null' EXIT

          host_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' "${container_id}")"
          for _ in {1..20}; do
            if response="$(curl --fail --silent --show-error "http://127.0.0.1:${host_port}/health")"; then
              if [[ "${response}" != '{"status":"ok"}' ]]; then
                echo "Unexpected health response: ${response}"
                exit 1
              fi

              readiness="$(curl --fail --silent --show-error "http://127.0.0.1:${host_port}/ready")"
              if [[ "${readiness}" != '{"status":"ready","checks":{"database":"ok"}}' ]]; then
                echo "Unexpected readiness response: ${readiness}"
                exit 1
              fi
              exit 0
            fi
            sleep 1
          done

          echo "Convia did not become healthy within 20 seconds"
          exit 1

      - name: Stop PostgreSQL
        if: always()
        run: |
          docker rm --force convia-ci-postgres >/dev/null 2>&1 || true
          docker network rm convia-ci >/dev/null 2>&1 || true

