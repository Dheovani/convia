name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Go project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Verify formatting
        shell: bash
        run: |
          mapfile -t go_files < <(find . -type f -name '*.go' -not -path './vendor/*')
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            echo "The following files are not formatted:"
            echo "${unformatted}"
            exit 1
          fi

      # The interface is compiled into the binary, and the tests that cover how
      # it is served skip when no bundle is present. Building it here is what
      # makes those tests run rather than pass by not running -- the same
      # failure M17 found in the Redis tests, where CI declared no dependency
      # and every cross-instance test was silently skipped.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the interface
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run go vet
        run: go vet ./...

      - name: Run Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Run tests with race detection and coverage
        run: go test -count=1 -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

      - name: Build all packages
        run: go build ./...

  interface:
    name: Validate the web interface
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # `npm run build` type-checks before it bundles, so a type error fails
      # here rather than at the next person's editor.
      - name: Type-check and build
        working-directory: web
        run: npm run build

      - name: Run tests
        working-directory: web
        run: npm test

  e2e:
    name: End-to-end call journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: convia
          POSTGRES_PASSWORD: convia
          POSTGRES_DB: convia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username=convia --dbname=convia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The Convia under test, configured as a developer's is. Development-only
    # credentials, matched in docker-compose.yml. Private addresses are allowed
    # because the journeys share rooms by invitation through the runner's own
    # network address: a link to loopback is refused as Convia itself.
    env:
      CONVIA_ENVIRONMENT: development
      CONVIA_HTTP_HOST: 0.0.0.0
      CONVIA_HTTP_PORT: "8080"
      CONVIA_DATABASE_URL: postgres://convia:convia@127.0.0.1:5432/convia?sslmode=disable
      CONVIA_LIVEKIT_URL: http://127.0.0.1:7880
      CONVIA_LIVEKIT_API_KEY: devkey
      CONVIA_LIVEKIT_API_SECRET: a-development-secret-long-enough-to-be-accepted
      CONVIA_PEERS_ALLOW_PRIVATE_ADDRESSES: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the interface and Convia
        run: |
          npm ci --prefix web
          npm run build --prefix web
          go build -o convia ./cmd/convia

      # The media server reports who connected and who left to the Convia on the
      # runner, and a browser on the runner reaches it on loopback.
      - name: Start LiveKit
        run: |
          docker run --detach --name convia-livekit \
            --add-host host.docker.internal:host-gateway \
            --publish 127.0.0.1:7880:7880 \
            --publish 127.0.0.1:7881:7881 \
            --publish 127.0.0.1:7882:7882/udp \
            --env "LIVEKIT_KEYS=devkey: a-development-secret-long-enough-to-be-accepted" \
            --env "LIVEKIT_CONFIG=$(printf 'webhook:\n  api_key: devkey\n  urls:\n    - http://host.docker.internal:8080/media/reports\n')" \
            livekit/livekit-server:v1.13.6 --dev --bind 0.0.0.0 --node-ip 127.0.0.1

      - name: Start Convia
        run: |
          ./convia migrate up
          nohup ./convia serve > convia.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8080/health \
              && curl --silent --fail --output /dev/null http://127.0.0.1:7880/; then
              echo "CONVIA_E2E_SHARE_URL=http://$(hostname -I | awk '{print $1}'):8080" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "Convia or LiveKit did not become ready"
          cat convia.log
          docker logs convia-livekit
          exit 1

      - name: Install the browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Type-check the journeys
        working-directory: web
        run: npm run typecheck:e2e

      - name: Run the journeys
        working-directory: web
        run: npm run test:e2e

      - name: Show what Convia and LiveKit said
        if: failure()
        run: |
          cat convia.log
          docker logs convia-livekit

      - name: Upload the journeys' report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: convia
          POSTGRES_PASSWORD: convia
          POSTGRES_DB: convia
        ports:
          - 5432:5432
        # The health check connects over TCP rather than the local socket: the
        # postgres image runs initdb against a temporary socket-only server, so
        # a socket probe reports ready while TCP connections are still refused.
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username=convia --dbname=convia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Everything that spans instances is skipped without this: carrying
      # events between them, and presence converging across them. Both are
      # about two processes agreeing, so a single-process test cannot cover
      # them and CI is the only place they run.
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CONVIA_DATABASE_URL: postgres://convia:convia@127.0.0.1:5432/convia?sslmode=disable
      CONVIA_TEST_DATABASE_URL: postgres://convia:convia@127.0.0.1:5432/convia?sslmode=disable
      # Development-only, and matched in docker-compose.yml. The media tests
      # are skipped when these are unset, so CI is the place they must be set.
      CONVIA_TEST_LIVEKIT_URL: http://127.0.0.1:7880
      CONVIA_TEST_LIVEKIT_API_KEY: devkey
      CONVIA_TEST_LIVEKIT_API_SECRET: a-development-secret-long-enough-to-be-accepted
      # Not database 0, because the presence tests empty the one they run in
      # and nobody should discover that by pointing this at something else.
      # The relay tests share it safely: publish/subscribe stores no keys.
      CONVIA_TEST_REDIS_URL: redis://127.0.0.1:6379/3

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # A service container cannot be given command arguments, and this one
      # needs --dev, so it is started as an ordinary step. Only the control API
      # is published: Convia does not carry media yet.
      - name: Start LiveKit
        run: |
          docker run --detach --name convia-livekit \
            --publish 127.0.0.1:7880:7880 \
            --env "LIVEKIT_KEYS=devkey: a-development-secret-long-enough-to-be-accepted" \
            livekit/livekit-server:v1.13.6 --dev --bind 0.0.0.0

      - name: Wait for LiveKit
        run: |
          for _ in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:7880/; then
              exit 0
            fi
            sleep 1
          done
          echo "LiveKit did not become ready"
          docker logs convia-livekit
          exit 1

      - name: Run tests against PostgreSQL, LiveKit, and Redis
        run: go test -count=1 -race -shuffle=on ./...

      - name: Verify migrations apply to an empty database
        run: go run ./cmd/convia migrate up

      - name: Verify migrations revert
        run: go run ./cmd/convia migrate down

      - name: Verify migrations reapply after a rollback
        run: go run ./cmd/convia migrate up

  application:
    name: Build the desktop application
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The application shows the interface out of its own binary, so a build
      # without one is a window with nothing in it -- which the application
      # refuses to open, and which this job would otherwise not notice.
      - name: Build the interface
        working-directory: web
        run: |
          npm ci
          npm run build

      # Everything else runs on Linux, where the window, the WebView2 check and
      # the Credential Manager are all excluded from the build or skipped. This
      # job is the only place they are compiled and run at all -- the same
      # failure M17 found in the Redis tests, where a dependency CI never
      # declared meant every test that needed it silently passed by not running.
      # No -race here. The detector needs a C compiler on Windows, and what it
      # would cover -- the stream's goroutines -- is code that builds on every
      # system and is already run under it on Linux. What only exists here is
      # single-threaded: a window, a version check, and the Credential Manager.
      - name: Run the application's tests
        run: go test -count=1 -shuffle=on ./cmd/convia-desktop/... ./internal/desktop/... ./internal/web/...

      - name: Build the application
        run: go build ./cmd/convia-desktop
