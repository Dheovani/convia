name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history. What this looks for is a credential that was
          # committed and then deleted -- which is still in the history, still
          # works, and is precisely the case nobody noticed at the time. A
          # shallow checkout cannot see it.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the history for secrets
        # Pinned by digest rather than by tag, for the same reason every action
        # above is: a tag is a name somebody else can move.
        run: |
          docker run --rm --volume "${PWD}:/repo" --workdir /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=. --config=.gitleaks.toml --redact --verbose

  supply-chain:
    name: Bill of materials and license policy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # What is actually shipped: the service binary and the modules it links.
      - name: Record what the release binary is made of
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 \
            app -json -licenses -main cmd/convia -output sbom-convia.json .

      # And everything in the build list, which is a larger set: a module only
      # the desktop application links is still a dependency of this repository,
      # and a policy that saw only the service would miss it.
      - name: Record what the repository depends on
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 \
            mod -json -licenses -output sbom-modules.json .

      - name: Check every dependency's license
        run: python3 .github/scripts/check_licenses.py sbom-modules.json

      - name: Publish the bill of materials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: |
            sbom-convia.json
            sbom-modules.json

  interface-dependencies:
    name: Interface dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # Two gates, because the two halves are not the same risk.
      #
      # What the bundle carries runs in somebody's browser, on the same origin
      # as their session, so it is held to `moderate`. What only the test run
      # carries never reaches anybody, so it is held to `high` -- tight enough
      # that a build tool taking arbitrary code is still refused, loose enough
      # that a path traversal in a test runner does not stop the work.
      - name: Install dependencies
        run: npm ci

      - name: Audit what the bundle carries
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit what the build and the tests carry
        run: npm audit --audit-level=high

      # Every Go module's licence has been checked since `M23-008`; the two
      # hundred npm packages the workspace pulls were checked by nothing. The
      # rule in AGENTS.md is about what Convia depends on, not about which
      # language it is written in.
      #
      # It holds what ships to the policy and only records what builds, which
      # is the split the two audits above already make: a CSS compiler under
      # weak copyleft is a tool Convia uses, while a library under one compiled
      # into the page is a term Convia would be passing on.
      - name: Check every shipped package's license
        run: python3 .github/scripts/check_npm_licenses.py

  vulnerabilities:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  codeql:
    name: CodeQL analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    # Both languages Convia is written in.
    #
    # The interface was missing here while the service was covered, which is
    # the wrong way round: it is the half that renders other people's names
    # and messages into a page, on the same origin as their session.
    #
    # fail-fast is off so that a finding in one language still reports the
    # other. They are independent analyses of independent code.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Only Go is built. TypeScript is analysed from source, which is what
      # `build-mode: none` means, and a build step there would fail the job.
      - name: Build for CodeQL
        if: matrix.build-mode == 'manual'
        run: go build ./...

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}

